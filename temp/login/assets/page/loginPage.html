  <script id="togglePassword">
    function togglePassword(event) {
        const passwordInput = document.getElementById('password');
        const icon = event.currentTarget.querySelector('i');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        }
    }
    </script> 
  <script id="handleLogin">
    function handleLogin(event) {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        
        if (!username || !password) {
            modalIcon.className = 'w-16 h-16 rounded-full flex justify-center items-center bg-red-100 text-red-500';
            modalIcon.innerHTML = '<i class="fas fa-exclamation-circle text-3xl"></i>';
            modalTitle.textContent = '登录失败';
            modalDesc.textContent = '用户名和密码不能为空';
        } else {
            modalIcon.className = 'w-16 h-16 rounded-full flex justify-center items-center bg-green-100 text-green-500';
            modalIcon.innerHTML = '<i class="fas fa-check-circle text-3xl"></i>';
            modalTitle.textContent = '登录成功';
            modalDesc.textContent = '欢迎使用智能瞭望与智能问数系统';
        }
        document.getElementById('loginModalMask').classList.remove('hidden');
    }
    </script> 
  <script>
var pageUuid = "";
        window.ytHandles = {
        //关闭id为targetId的目标容器
        hide: function(targetId) {
            const modal = document.getElementById(targetId);//获取targetId的元素
            // 检查targetId元素是否存在
            if (!modal) {console.error('Modal element not found: targetId');return;}
            //1. 准备隐藏前先清理旧动画和监听器
            if (modal._hideTimeout) clearTimeout(modal._hideTimeout);
            if (modal._showAnimationEndHandler) {
                modal.removeEventListener("animationend", modal._showAnimationEndHandler);
                delete modal._showAnimationEndHandler;
            }
            modal.style.animation = "";
            // 2. 强制重绘以确保样式应用
            void modal.offsetHeight;
            // 3. 启动淡出动画
            modal.style.animation = 'yt_modalFadeOut 0.3s ease-out';
            let animationCompleted = false;
            const onAnimationEnd = function () {
              if (animationCompleted) return;
              animationCompleted = true;
              // 4. 动画结束后，添加隐藏类并清空所有内联干扰样式
              modal.classList.add("hidden");
              modal.style.display = "";
              modal.style.visibility = "";
              modal.style.opacity = "";
              modal.style.animation = "";
              modal.style.transform = "";
              // 清理引用
              delete modal._hideAnimationEndHandler;
              if (modal._hideTimeout) {
                clearTimeout(modal._hideTimeout);
                delete modal._hideTimeout;
              }
            };
            // 5. 使用事件监听 + 定时器双重保险，确保清理逻辑一定会执行
            modal._hideAnimationEndHandler = onAnimationEnd;
            modal.addEventListener("animationend", onAnimationEnd, { once: true });
            modal._hideTimeout = setTimeout(onAnimationEnd, 400); // 略长于动画时间
        }
        };
window.onload = function(){
        try {
          //为#togglePassword元素添加点击事件监听器
          document.getElementById('togglePassword').addEventListener('click',function(event){
             togglePassword(event);
          })
        } catch (e) {
          console.error('JsHandle error:', e);
        }
        try {
          //为#loginBtn元素添加点击事件监听器
          document.getElementById('loginBtn').addEventListener('click',function(event){
             handleLogin(event);
          })
        } catch (e) {
          console.error('JsHandle error:', e);
        }
        try {
          //为#closeModalBtn元素添加点击事件监听器
          document.getElementById('closeModalBtn').addEventListener('click',function(event){
             ytHandles.hide('loginModalMask');
          })
        } catch (e) {
          console.error('CloseModal error:', e);
        }
};
