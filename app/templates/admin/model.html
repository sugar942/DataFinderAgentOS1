{% extends "base.html" %}
{% block body %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
    /* ===== Immersive Dark Theme ===== */
    .admin-content { background: #0a0a14; }

    /* Animated mesh background */
    .model-page {
        position: relative;
    }
    .model-bg {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background:
            radial-gradient(ellipse at 30% 20%, rgba(109,40,217,0.08) 0%, transparent 60%),
            radial-gradient(ellipse at 70% 60%, rgba(6,182,212,0.06) 0%, transparent 60%),
            radial-gradient(ellipse at 50% 80%, rgba(124,58,237,0.05) 0%, transparent 50%);
        pointer-events: none;
        z-index: 0;
    }
    .model-page > * { position: relative; z-index: 1; }

    /* Hero header */
    .model-hero {
        background: linear-gradient(135deg, #0f0f23 0%, #1a1040 40%, #0d1b2a 100%);
        border: 1px solid rgba(124,58,237,0.25);
        border-radius: 20px;
        padding: 30px 36px;
        margin-bottom: 24px;
        position: relative;
        overflow: hidden;
    }
    .model-hero::before {
        content: '';
        position: absolute;
        top: -50%; right: -20%;
        width: 400px; height: 400px;
        background: radial-gradient(circle, rgba(124,58,237,0.15) 0%, transparent 70%);
        pointer-events: none;
    }
    .model-hero::after {
        content: '';
        position: absolute;
        bottom: -40%; left: 10%;
        width: 300px; height: 300px;
        background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 70%);
        pointer-events: none;
    }
    .model-hero h3 {
        margin: 0 0 6px 0;
        font-size: 22px;
        font-weight: 700;
        background: linear-gradient(135deg, #c4b5fd, #a78bfa, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        position: relative;
    }
    .model-hero p {
        margin: 0;
        font-size: 13px;
        color: rgba(255,255,255,0.5);
        position: relative;
    }
    .hero-actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
        position: relative;
    }
    .btn-neon {
        height: 42px;
        padding: 0 24px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.25s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    .btn-neon.primary {
        background: linear-gradient(135deg, #7c3aed, #6d28d9);
        color: #fff;
        box-shadow: 0 0 20px rgba(124,58,237,0.3), 0 4px 12px rgba(109,40,217,0.4);
    }
    .btn-neon.primary:hover {
        box-shadow: 0 0 30px rgba(124,58,237,0.5), 0 6px 20px rgba(109,40,217,0.5);
        transform: translateY(-2px);
    }
    .btn-neon.secondary {
        background: rgba(255,255,255,0.06);
        color: #c4b5fd;
        border: 1px solid rgba(124,58,237,0.3);
    }
    .btn-neon.secondary:hover {
        background: rgba(124,58,237,0.15);
        border-color: rgba(124,58,237,0.5);
        box-shadow: 0 0 16px rgba(124,58,237,0.2);
    }
    .search-input-dark {
        height: 42px;
        width: 260px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.05);
        color: #e2d9f3;
        font-size: 13px;
        outline: none;
        transition: all 0.2s;
    }
    .search-input-dark::placeholder { color: rgba(255,255,255,0.3); }
    .search-input-dark:focus {
        border-color: rgba(124,58,237,0.5);
        box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
        background: rgba(255,255,255,0.08);
    }

    /* Stats row */
    .stats-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 24px;
    }
    .stat-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 20px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        transition: all 0.3s;
        backdrop-filter: blur(10px);
        position: relative;
        overflow: hidden;
    }
    .stat-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: 16px;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
    }
    .stat-card:hover {
        transform: translateY(-3px);
        border-color: rgba(124,58,237,0.3);
    }
    .stat-card:hover::before {
        opacity: 1;
    }
    .stat-card.total::before { background: radial-gradient(circle at 50% 0%, rgba(124,58,237,0.1), transparent 70%); }
    .stat-card.prompt::before { background: radial-gradient(circle at 50% 0%, rgba(249,115,22,0.1), transparent 70%); }
    .stat-card.completion::before { background: radial-gradient(circle at 50% 0%, rgba(6,182,212,0.1), transparent 70%); }
    .stat-card.count::before { background: radial-gradient(circle at 50% 0%, rgba(16,185,129,0.1), transparent 70%); }

    .stat-icon {
        width: 48px; height: 48px;
        border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; color: #fff;
        flex-shrink: 0;
        position: relative;
    }
    .stat-icon.total { background: linear-gradient(135deg, #7c3aed, #6d28d9); box-shadow: 0 0 20px rgba(124,58,237,0.3); }
    .stat-icon.prompt { background: linear-gradient(135deg, #f97316, #ef4444); box-shadow: 0 0 20px rgba(249,115,22,0.3); }
    .stat-icon.completion { background: linear-gradient(135deg, #06b6d4, #3b82f6); box-shadow: 0 0 20px rgba(6,182,212,0.3); }
    .stat-icon.count { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 0 20px rgba(16,185,129,0.3); }

    .stat-value {
        font-size: 26px;
        font-weight: 800;
        color: #f5f3fa;
        letter-spacing: -0.5px;
    }
    .stat-label {
        font-size: 11px;
        color: rgba(255,255,255,0.4);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 2px;
    }

    /* Model grid */
    .model-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 20px;
    }
    .model-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 22px;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
    }
    .model-card::after {
        content: '';
        position: absolute;
        top: -1px; left: 30px; right: 30px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(124,58,237,0.4), transparent);
        opacity: 0;
        transition: opacity 0.3s;
    }
    .model-card:hover {
        transform: translateY(-6px);
        border-color: rgba(124,58,237,0.35);
        box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(124,58,237,0.1) inset;
    }
    .model-card:hover::after { opacity: 1; }
    .model-card.disabled-card { opacity: 0.4; }
    .model-card.disabled-card:hover { opacity: 0.6; transform: translateY(-3px); }

    .model-card.default-card {
        border-color: rgba(245,158,11,0.4);
        box-shadow: 0 0 30px rgba(245,158,11,0.1);
    }
    .model-card.default-card:hover {
        border-color: rgba(245,158,11,0.6);
        box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 30px rgba(245,158,11,0.2);
    }
    .model-card.default-card::after {
        background: linear-gradient(90deg, transparent, rgba(245,158,11,0.5), transparent);
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 14px;
    }
    .card-header-left {
        display: flex;
        align-items: center;
        gap: 14px;
    }
    .card-icon {
        width: 46px; height: 46px;
        border-radius: 13px;
        background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(109,40,217,0.2));
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; color: #c4b5fd;
        flex-shrink: 0;
        border: 1px solid rgba(124,58,237,0.2);
    }
    .default-card .card-icon {
        background: linear-gradient(135deg, rgba(245,158,11,0.3), rgba(217,119,6,0.2));
        border-color: rgba(245,158,11,0.3);
        color: #fcd34d;
    }
    .card-name {
        font-size: 16px;
        font-weight: 700;
        color: #f5f3fa;
    }
    .card-model-id {
        font-size: 11px;
        color: rgba(255,255,255,0.35);
        font-family: 'SF Mono', 'Consolas', monospace;
        margin-top: 2px;
    }
    .card-badge {
        font-size: 10px;
        padding: 3px 12px;
        border-radius: 20px;
        font-weight: 700;
        letter-spacing: 0.3px;
        text-transform: uppercase;
    }
    .card-badge.default {
        background: rgba(245,158,11,0.2);
        color: #fcd34d;
        border: 1px solid rgba(245,158,11,0.3);
    }
    .card-badge.enabled {
        background: rgba(16,185,129,0.15);
        color: #6ee7b7;
        border: 1px solid rgba(16,185,129,0.25);
    }
    .card-badge.disabled {
        background: rgba(239,68,68,0.15);
        color: #fca5a5;
        border: 1px solid rgba(239,68,68,0.25);
    }

    .card-desc {
        font-size: 12px;
        color: rgba(255,255,255,0.4);
        line-height: 1.5;
        margin-bottom: 16px;
    }

    /* Token section */
    .token-section {
        background: rgba(0,0,0,0.25);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 14px;
        border: 1px solid rgba(255,255,255,0.05);
    }
    .token-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    .token-row:last-child { margin-bottom: 0; }
    .token-label {
        font-size: 11px;
        color: rgba(255,255,255,0.4);
        text-transform: uppercase;
        letter-spacing: 0.3px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .token-label .dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        display: inline-block;
    }
    .dot.prompt-dot { background: #f97316; box-shadow: 0 0 6px rgba(249,115,22,0.5); }
    .dot.completion-dot { background: #06b6d4; box-shadow: 0 0 6px rgba(6,182,212,0.5); }
    .token-val {
        font-size: 13px;
        font-weight: 700;
        color: rgba(255,255,255,0.7);
        font-family: 'SF Mono', 'Consolas', monospace;
    }
    .token-bar {
        height: 4px;
        border-radius: 2px;
        background: rgba(255,255,255,0.06);
        overflow: hidden;
        display: flex;
        margin-bottom: 2px;
    }
    .token-bar .bar-prompt {
        background: linear-gradient(90deg, #f97316, #ef4444);
        transition: width 0.6s ease;
    }
    .token-bar .bar-completion {
        background: linear-gradient(90deg, #06b6d4, #3b82f6);
        transition: width 0.6s ease;
    }
    .token-total-line {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: rgba(255,255,255,0.3);
        margin-top: 6px;
    }

    /* Config tags */
    .config-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 16px;
    }
    .config-tag {
        font-size: 10px;
        padding: 3px 10px;
        border-radius: 6px;
        background: rgba(124,58,237,0.12);
        color: #a78bfa;
        border: 1px solid rgba(124,58,237,0.15);
        font-weight: 500;
    }
    .config-tag.provider-tag {
        background: rgba(6,182,212,0.12);
        color: #67e8f9;
        border-color: rgba(6,182,212,0.2);
        font-weight: 700;
    }

    /* Card actions */
    .card-actions {
        display: flex;
        gap: 8px;
        padding-top: 16px;
        border-top: 1px solid rgba(255,255,255,0.06);
    }
    .card-btn {
        flex: 1;
        height: 38px;
        border: none;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }
    .card-btn.primary {
        background: linear-gradient(135deg, #7c3aed, #6d28d9);
        color: #fff;
    }
    .card-btn.primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 20px rgba(124,58,237,0.4);
    }
    .card-btn.secondary {
        background: rgba(255,255,255,0.05);
        color: #c4b5fd;
        border: 1px solid rgba(255,255,255,0.08);
    }
    .card-btn.secondary:hover {
        background: rgba(124,58,237,0.15);
        border-color: rgba(124,58,237,0.3);
    }
    .card-btn.gold {
        background: rgba(245,158,11,0.1);
        color: #fcd34d;
        border: 1px solid rgba(245,158,11,0.2);
    }
    .card-btn.gold:hover {
        background: rgba(245,158,11,0.2);
        border-color: rgba(245,158,11,0.4);
        box-shadow: 0 0 16px rgba(245,158,11,0.2);
    }
    .card-btn.danger {
        background: rgba(239,68,68,0.08);
        color: #fca5a5;
        border: 1px solid rgba(239,68,68,0.15);
    }
    .card-btn.danger:hover {
        background: rgba(239,68,68,0.18);
        border-color: rgba(239,68,68,0.3);
        box-shadow: 0 0 16px rgba(239,68,68,0.2);
    }

    /* Empty state */
    .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: rgba(255,255,255,0.3);
        grid-column: 1/-1;
    }
    .empty-state i {
        font-size: 56px;
        display: block;
        margin-bottom: 16px;
        opacity: 0.5;
    }
    .empty-state p { font-size: 15px; margin: 0; }

    /* Pagination */
    .pagination-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid rgba(255,255,255,0.06);
    }
    .pagination-bar button {
        padding: 8px 18px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px;
        background: rgba(255,255,255,0.04);
        color: rgba(255,255,255,0.6);
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s;
    }
    .pagination-bar button:hover {
        border-color: rgba(124,58,237,0.4);
        color: #c4b5fd;
        background: rgba(124,58,237,0.1);
    }
    .pagination-bar button:disabled { opacity: 0.3; cursor: not-allowed; }
    .pagination-bar .page-info { font-size: 13px; color: rgba(255,255,255,0.4); }

    /* ===== Modal ===== */
    .modal-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(8px);
        display: flex; align-items: center; justify-content: center;
        z-index: 9999; opacity: 0; visibility: hidden;
        transition: all 0.25s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content {
        background: linear-gradient(180deg, #1a1040 0%, #0f0f23 100%);
        border: 1px solid rgba(124,58,237,0.25);
        border-radius: 20px;
        width: 92%; max-width: 680px;
        max-height: 90vh; overflow-y: auto;
        transform: translateY(20px); transition: transform 0.3s;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(124,58,237,0.15);
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .modal-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 22px 28px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.02);
        border-radius: 20px 20px 0 0;
    }
    .modal-header h2 {
        color: #f5f3fa;
        font-size: 18px;
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .modal-header h2 i { color: #7c3aed; font-size: 20px; }
    .modal-close {
        width: 34px; height: 34px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.05);
        color: rgba(255,255,255,0.5);
        font-size: 18px; cursor: pointer;
        transition: all 0.15s;
        display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover {
        background: rgba(239,68,68,0.2);
        border-color: rgba(239,68,68,0.3);
        color: #fca5a5;
    }
    .modal-body { padding: 24px 28px; }
    .modal-footer {
        display: flex; justify-content: flex-end; gap: 10px;
        padding: 18px 28px;
        border-top: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.02);
        border-radius: 0 0 20px 20px;
    }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-group label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: rgba(255,255,255,0.5);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        height: 44px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.05);
        color: #e2d9f3;
        font-size: 13px;
        transition: all 0.2s;
        box-sizing: border-box;
        outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
        border-color: rgba(124,58,237,0.5);
        box-shadow: 0 0 0 3px rgba(124,58,237,0.12);
        background: rgba(255,255,255,0.08);
    }
    .form-group select { background-color: #12102a; }
    .form-group select option { background: #1a1040; color: #e2d9f3; }
    .form-group textarea { height: 72px; padding: 12px 16px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* SSE Test area */
    .test-section {
        margin-top: 18px;
        border: 1px solid rgba(124,58,237,0.2);
        border-radius: 14px;
        overflow: hidden;
        background: rgba(0,0,0,0.3);
    }
    .test-header {
        padding: 12px 18px;
        background: rgba(124,58,237,0.1);
        border-bottom: 1px solid rgba(124,58,237,0.15);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .test-header span {
        font-size: 12px;
        font-weight: 600;
        color: #c4b5fd;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .test-header .pulse-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px rgba(16,185,129,0.5);
    }
    .test-header .pulse-dot.streaming {
        background: #f59e0b;
        box-shadow: 0 0 10px rgba(245,158,11,0.6);
        animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .test-body { padding: 16px; }
    .test-input-dark {
        width: 100%;
        min-height: 56px;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.05);
        color: #e2d9f3;
        font-size: 13px;
        resize: vertical;
        box-sizing: border-box;
        outline: none;
        font-family: inherit;
        transition: all 0.2s;
    }
    .test-input-dark:focus {
        border-color: rgba(124,58,237,0.4);
        box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
    }
    .test-output-dark {
        min-height: 80px;
        max-height: 320px;
        overflow-y: auto;
        padding: 16px;
        border-radius: 10px;
        background: rgba(0,0,0,0.4);
        font-size: 13px;
        line-height: 1.7;
        color: #e2d9f3;
        border: 1px solid rgba(255,255,255,0.06);
        margin-top: 12px;
        font-family: 'SF Mono', 'Consolas', 'Menlo', monospace;
    }
    .test-output-dark h1,.test-output-dark h2,.test-output-dark h3 { color: #c4b5fd; font-weight: 700; margin: 12px 0 6px; }
    .test-output-dark h1 { font-size: 18px; border-bottom: 1px solid rgba(124,58,237,0.3); padding-bottom: 6px; }
    .test-output-dark h2 { font-size: 16px; } .test-output-dark h3 { font-size: 14px; }
    .test-output-dark p { margin: 6px 0; }
    .test-output-dark code {
        background: rgba(124,58,237,0.15);
        padding: 2px 6px; border-radius: 4px;
        font-size: 12px; color: #c4b5fd;
    }
    .test-output-dark pre { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; border: 1px solid rgba(255,255,255,0.06); }
    .test-output-dark pre code { background: transparent; padding: 0; }
    .test-output-dark blockquote {
        border-left: 3px solid #7c3aed;
        padding-left: 12px; margin: 10px 0;
        color: rgba(255,255,255,0.5);
    }
    .test-output-dark .cursor-blink {
        display: inline-block;
        width: 2px; height: 16px;
        background: #c4b5fd;
        animation: blink 0.8s infinite;
        vertical-align: text-bottom;
        margin-left: 2px;
    }
    @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    .test-token-stats {
        display: flex;
        gap: 20px;
        margin-top: 12px;
        padding: 12px 16px;
        background: rgba(0,0,0,0.3);
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.05);
    }
    .test-token-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
    }
    .test-token-item .tt-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
    }
    .test-token-item .tt-val {
        font-weight: 700;
        color: #e2d9f3;
        font-family: 'SF Mono', 'Consolas', monospace;
    }
    .test-token-item .tt-lbl {
        color: rgba(255,255,255,0.4);
    }

    .btn-test-run {
        height: 40px;
        padding: 0 20px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid rgba(124,58,237,0.3);
        background: rgba(124,58,237,0.15);
        color: #c4b5fd;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
    }
    .btn-test-run:hover {
        background: rgba(124,58,237,0.25);
        border-color: rgba(124,58,237,0.5);
        box-shadow: 0 0 20px rgba(124,58,237,0.2);
    }
    .btn-test-run:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner-sm {
        width: 16px; height: 16px;
        border: 2px solid rgba(255,255,255,0.2);
        border-top-color: #c4b5fd;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
        .stats-row { grid-template-columns: repeat(2, 1fr); }
        .model-grid { grid-template-columns: 1fr; }
        .form-row { grid-template-columns: 1fr; }
        .hero-actions { flex-wrap: wrap; }
        .search-input-dark { width: 100%; }
    }
</style>

<div class="model-page">
<div class="model-bg"></div>

<div class="model-hero">
    <h3><i class="fas fa-cpu"></i> 模型引擎</h3>
    <p>大语言模型配置中心 · OpenAI 兼容接口 · 沉浸式管理体验</p>
    <div class="hero-actions">
        <input type="text" class="search-input-dark" id="searchInput" placeholder="搜索模型名称、Model ID...">
        <button class="btn-neon secondary" id="searchBtn"><i class="fas fa-search"></i> 搜索</button>
        <button class="btn-neon primary" id="addBtn"><i class="fas fa-plus"></i> 添加模型</button>
    </div>
</div>

<div class="stats-row" id="statsRow">
    <div class="stat-card total">
        <div class="stat-icon total"><i class="fas fa-bolt"></i></div>
        <div><div class="stat-value" id="stat-total">0</div><div class="stat-label">总 Token 消耗</div></div>
    </div>
    <div class="stat-card prompt">
        <div class="stat-icon prompt"><i class="fas fa-arrow-right"></i></div>
        <div><div class="stat-value" id="stat-prompt">0</div><div class="stat-label">Prompt Token</div></div>
    </div>
    <div class="stat-card completion">
        <div class="stat-icon completion"><i class="fas fa-arrow-left"></i></div>
        <div><div class="stat-value" id="stat-completion">0</div><div class="stat-label">Completion Token</div></div>
    </div>
    <div class="stat-card count">
        <div class="stat-icon count"><i class="fas fa-layer-group"></i></div>
        <div><div class="stat-value" id="stat-count">0</div><div class="stat-label">已配置模型</div></div>
    </div>
</div>

<div class="model-grid" id="modelGrid">
    <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i><p>加载模型中...</p></div>
</div>

<div class="pagination-bar" id="pagination" style="display:none;"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modelModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle"><i class="fas fa-microchip"></i> 添加模型</h2>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="modelForm" onsubmit="return false;">
                <input type="hidden" id="modelDbId">
                <div class="form-group">
                    <label>模型名称 *</label>
                    <input type="text" id="mname" required placeholder="例如：GPT-4 Turbo">
                </div>
                <div class="form-group">
                    <label>Model ID *</label>
                    <input type="text" id="mmodelId" required placeholder="例如：gpt-4-turbo">
                </div>
                <div class="form-group">
                    <label>API Key *</label>
                    <input type="password" id="mapiKey" required placeholder="sk-...">
                </div>
                <div class="form-group">
                    <label>Base URL *</label>
                    <input type="url" id="mbaseUrl" required placeholder="https://api.openai.com/v1">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Temperature</label>
                        <input type="number" id="mtemp" step="0.1" min="0" max="2" value="0.7">
                    </div>
                    <div class="form-group">
                        <label>Max Tokens</label>
                        <input type="number" id="mmaxTokens" min="1" max="128000" value="4096">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Top P</label>
                        <input type="number" id="mtopP" step="0.1" min="0" max="1" value="0.9">
                    </div>
                    <div class="form-group">
                        <label>Provider</label>
                        <select id="mprovider">
                            <option value="openai">OpenAI</option>
                            <option value="azure">Azure</option>
                            <option value="anthropic">Anthropic</option>
                            <option value="google">Google</option>
                            <option value="deepseek">DeepSeek</option>
                            <option value="moonshot">Moonshot</option>
                            <option value="zhipu">智谱 GLM</option>
                            <option value="qwen">通义千问</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Frequency Penalty</label>
                        <input type="number" id="mfreqPenalty" step="0.1" min="-2" max="2" value="0.0">
                    </div>
                    <div class="form-group">
                        <label>Presence Penalty</label>
                        <input type="number" id="mpresPenalty" step="0.1" min="-2" max="2" value="0.0">
                    </div>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="mdesc" placeholder="模型能力、适用场景描述..."></textarea>
                </div>

                <!-- SSE Test -->
                <div class="test-section" id="testSection" style="display:none;">
                    <div class="test-header">
                        <span>
                            <span class="pulse-dot" id="testDot"></span>
                            SSE 流式测试
                        </span>
                        <span style="font-size:10px;color:rgba(255,255,255,0.3);">Server-Sent Events</span>
                    </div>
                    <div class="test-body">
                        <textarea class="test-input-dark" id="testPrompt" placeholder="输入测试提示词，测试模型响应..."></textarea>
                        <button type="button" class="btn-test-run" onclick="runTest()" id="testBtn">
                            <span id="testBtnText"><i class="fas fa-play"></i> 运行测试</span>
                            <span id="testLoading" class="spinner-sm" style="display:none;"></span>
                        </button>
                        <div class="test-output-dark" id="testOutput" style="display:none;"></div>
                        <div class="test-token-stats" id="testTokens" style="display:none;"></div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-neon secondary" onclick="closeModal()">取消</button>
            <button class="btn-neon primary" onclick="submitForm()">保存模型</button>
        </div>
    </div>
</div>
{% end %}

{% block script %}
<script>
var currentModelId = null;
var allModels = [];
var currentPage = 1;
var totalPages = 1;
var pageSize = 12;

function fmt(n){ return n ? parseInt(n).toLocaleString() : '0'; }

function loadModels(page){
    page = page || 1;
    currentPage = page;
    var keyword = $('#searchInput').val() || '';
    $.get('/admin/api/models', {keyword: keyword, page: page, page_size: pageSize}, function(res){
        if(res.code === 0 && res.data){
            var data = res.data;
            allModels = data.models || [];
            var stats = data.token_stats || {};
            $('#stat-total').text(fmt(stats.total || 0));
            $('#stat-prompt').text(fmt(stats.prompt || 0));
            $('#stat-completion').text(fmt(stats.completion || 0));
            $('#stat-count').text(stats.count || 0);
            totalPages = Math.ceil((data.total || 0) / pageSize) || 1;
            renderCards();
            renderPagination();
        }
    });
}

function renderCards(){
    var html = '';
    if(allModels.length === 0){
        html = '<div class="empty-state"><i class="fas fa-cube"></i><p>暂无模型配置<br><small style="color:rgba(255,255,255,0.2);">点击上方「添加模型」开始配置 AI 引擎</small></p></div>';
    }
    layui.each(allModels, function(i, m){
        var isDefault = m.is_default === 1;
        var enabled = m.status === 1;
        var cls = '';
        if(!enabled) cls += ' disabled-card';
        if(isDefault) cls += ' default-card';
        var badgeCls = isDefault ? 'default' : (enabled ? 'enabled' : 'disabled');
        var badgeText = isDefault ? '★ 默认' : (enabled ? '● 启用' : '○ 禁用');

        var totalT = m.total_tokens || 0;
        var promptT = m.prompt_tokens || 0;
        var completionT = m.completion_tokens || 0;
        var promptPct = totalT > 0 ? (promptT / totalT * 100) : 0;
        var completionPct = totalT > 0 ? (completionT / totalT * 100) : 0;

        html += '<div class="model-card'+cls+'">';
        html += '<div class="card-header">';
        html += '<div class="card-header-left">';
        html += '<div class="card-icon"><i class="fas fa-robot"></i></div>';
        html += '<div><div class="card-name">'+m.name+'</div><div class="card-model-id">'+m.model_id+'</div></div>';
        html += '</div>';
        html += '<span class="card-badge '+badgeCls+'">'+badgeText+'</span>';
        html += '</div>';

        if(m.description) html += '<div class="card-desc">'+m.description+'</div>';

        html += '<div class="token-section">';
        html += '<div class="token-row">';
        html += '<span class="token-label"><span class="dot prompt-dot"></span> Prompt</span>';
        html += '<span class="token-val">'+fmt(promptT)+'</span>';
        html += '</div>';
        html += '<div class="token-row">';
        html += '<span class="token-label"><span class="dot completion-dot"></span> Completion</span>';
        html += '<span class="token-val">'+fmt(completionT)+'</span>';
        html += '</div>';
        if(totalT > 0){
            html += '<div class="token-bar">';
            html += '<div class="bar-prompt" style="width:'+promptPct+'%"></div>';
            html += '<div class="bar-completion" style="width:'+completionPct+'%"></div>';
            html += '</div>';
        }
        html += '<div class="token-total-line"><span>总计</span><span>'+fmt(totalT)+' tokens</span></div>';
        html += '</div>';

        html += '<div class="config-tags">';
        html += '<span class="config-tag provider-tag">'+(m.provider||'openai').toUpperCase()+'</span>';
        html += '<span class="config-tag">T: '+(m.temperature||0.7)+'</span>';
        html += '<span class="config-tag">Max: '+(m.max_tokens||4096)+'</span>';
        html += '<span class="config-tag">TopP: '+(m.top_p||0.9)+'</span>';
        html += '</div>';

        html += '<div class="card-actions">';
        html += '<button class="card-btn primary" onclick="testModel('+m.id+')"><i class="fas fa-play"></i> 测试</button>';
        html += '<button class="card-btn secondary" onclick="editModel('+m.id+')"><i class="fas fa-edit"></i> 编辑</button>';
        if(!isDefault){
            html += '<button class="card-btn gold" onclick="setDefault('+m.id+')"><i class="fas fa-star"></i> 设默认</button>';
        }
        html += '<button class="card-btn danger" onclick="deleteModel('+m.id+')"><i class="fas fa-trash"></i></button>';
        html += '</div>';
        html += '</div>';
    });
    $('#modelGrid').html(html);
}

function renderPagination(){
    if(totalPages <= 1){
        $('#pagination').hide();
        return;
    }
    var html = '';
    html += '<button '+(currentPage<=1?'disabled':'')+' onclick="loadModels('+(currentPage-1)+')">&lt; 上一页</button>';
    html += '<span class="page-info">第 '+currentPage+' 页 / 共 '+totalPages+' 页</span>';
    html += '<button '+(currentPage>=totalPages?'disabled':'')+' onclick="loadModels('+(currentPage+1)+')">下一页 &gt;</button>';
    $('#pagination').html(html).show();
}

$('#searchBtn').click(function(){ loadModels(1); });
$('#searchInput').on('keydown', function(e){ if(e.key==='Enter') loadModels(1); });

$('#addBtn').click(function(){
    currentModelId = null;
    $('#modalTitle').html('<i class="fas fa-microchip"></i> 添加模型');
    $('#modelForm')[0].reset();
    $('#modelDbId').val('');
    $('#mprovider').val('openai');
    $('#mtemp').val('0.7'); $('#mmaxTokens').val('4096'); $('#mtopP').val('0.9');
    $('#mfreqPenalty').val('0'); $('#mpresPenalty').val('0');
    $('#testSection').hide();
    $('#testOutput').hide().html('');
    $('#testTokens').hide().html('');
    $('#testPrompt').val('');
    $('#modelModal').addClass('active');
});

function editModel(id){
    currentModelId = id;
    var m = allModels.find(function(x){ return x.id === id; });
    if(!m) return;
    $('#modalTitle').html('<i class="fas fa-pen-to-square"></i> 编辑模型');
    $('#modelDbId').val(m.id);
    $('#mname').val(m.name);
    $('#mmodelId').val(m.model_id);
    $('#mapiKey').val(m.api_key);
    $('#mbaseUrl').val(m.base_url);
    $('#mtemp').val(m.temperature);
    $('#mmaxTokens').val(m.max_tokens);
    $('#mtopP').val(m.top_p);
    $('#mfreqPenalty').val(m.frequency_penalty);
    $('#mpresPenalty').val(m.presence_penalty);
    $('#mdesc').val(m.description||'');
    $('#mprovider').val(m.provider||'openai');
    $('#testSection').show();
    $('#testOutput').hide().html('');
    $('#testTokens').hide().html('');
    $('#testPrompt').val('');
    $('#testDot').removeClass('streaming');
    $('#modelModal').addClass('active');
}

function closeModal(){
    $('#modelModal').removeClass('active');
}

function submitForm(){
    var action = $('#modelDbId').val() ? 'edit' : 'add';
    var data = {
        action: action,
        id: parseInt($('#modelDbId').val()) || 0,
        name: $('#mname').val().trim(),
        model_id: $('#mmodelId').val().trim(),
        api_key: $('#mapiKey').val().trim(),
        base_url: $('#mbaseUrl').val().trim(),
        temperature: parseFloat($('#mtemp').val()) || 0.7,
        max_tokens: parseInt($('#mmaxTokens').val()) || 4096,
        top_p: parseFloat($('#mtopP').val()) || 0.9,
        frequency_penalty: parseFloat($('#mfreqPenalty').val()) || 0,
        presence_penalty: parseFloat($('#mpresPenalty').val()) || 0,
        description: $('#mdesc').val().trim(),
        provider: $('#mprovider').val()
    };
    if(!data.name || !data.model_id || !data.api_key || !data.base_url){
        layer.msg('模型名称/ID/API Key/Base URL 不能为空', {icon:2}); return;
    }
    $.ajax({
        url: '/admin/api/models', type: 'POST', contentType: 'application/json',
        data: JSON.stringify(data),
        success: function(res){
            if(res.code === 0){
                closeModal(); loadModels(currentPage); layer.msg('操作成功', {icon:1});
            } else { layer.msg(res.msg, {icon:2}); }
        }
    });
}

function deleteModel(id){
    layer.confirm('确定要删除该模型吗？此操作不可恢复。', {icon:3, title:'删除确认'}, function(index){
        layer.close(index);
        $.ajax({
            url: '/admin/api/models', type: 'POST', contentType: 'application/json',
            data: JSON.stringify({action: 'delete', id: id}),
            success: function(res){
                if(res.code === 0){ loadModels(currentPage); layer.msg('删除成功', {icon:1}); }
                else { layer.msg(res.msg, {icon:2}); }
            }
        });
    });
}

function setDefault(id){
    layer.confirm('确定要将此模型设为系统默认模型吗？<br><small style="color:#999;">系统将优先使用默认模型响应业务请求</small>', {icon:3, title:'设置默认模型'}, function(index){
        layer.close(index);
        $.ajax({
            url: '/admin/api/models', type: 'POST', contentType: 'application/json',
            data: JSON.stringify({action: 'set_default', id: id}),
            success: function(res){
                if(res.code === 0){ loadModels(currentPage); layer.msg('默认模型已设置', {icon:1}); }
                else { layer.msg(res.msg, {icon:2}); }
            }
        });
    });
}

function testModel(id){
    editModel(id);
    setTimeout(function(){ $('#testPrompt').focus(); }, 350);
}

function runTest(){
    var modelDbId = $('#modelDbId').val();
    var prompt = $('#testPrompt').val().trim() || '请用一句话介绍你自己';
    $('#testBtnText').html('<i class="fas fa-spinner fa-pulse"></i> 流式响应中...');
    $('#testLoading').show();
    $('#testOutput').show().html('<span style="color:rgba(255,255,255,0.3);">等待模型响应<span class="cursor-blink"></span></span>');
    $('#testTokens').hide().html('');
    $('#testDot').addClass('streaming');
    $('#testOutput').data('content', '');

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/admin/api/model/test', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    var xsrf = document.cookie.match(/_xsrf=([^;]+)/);
    if(xsrf) xhr.setRequestHeader('X-Xsrftoken', xsrf[1]);

    var lastProcessed = 0;
    xhr.onprogress = function(){
        var text = xhr.responseText;
        var newText = text.substring(lastProcessed);
        lastProcessed = text.length;

        var lines = newText.split('\n');
        for(var i = 0; i < lines.length; i++){
            var line = lines[i].trim();
            if(line.indexOf('data: ') === 0){
                try {
                    var chunk = JSON.parse(line.substring(6));
                    if(chunk.type === 'token'){
                        var content = $('#testOutput').data('content') || '';
                        content += chunk.content;
                        $('#testOutput').data('content', content);
                        var rendered = marked.parse(content);
                        $('#testOutput').html(rendered + '<span class="cursor-blink"></span>');
                        $('#testTokens').show().html(
                            '<div class="test-token-item"><span class="tt-dot" style="background:#f97316;box-shadow:0 0 6px rgba(249,115,22,0.5);"></span><span class="tt-lbl">Prompt</span><span class="tt-val">'+fmt(chunk.prompt_tokens)+'</span></div>'+
                            '<div class="test-token-item"><span class="tt-dot" style="background:#06b6d4;box-shadow:0 0 6px rgba(6,182,212,0.5);"></span><span class="tt-lbl">Completion</span><span class="tt-val">'+fmt(chunk.completion_tokens)+'</span></div>'+
                            '<div class="test-token-item"><span class="tt-dot" style="background:#7c3aed;box-shadow:0 0 6px rgba(124,58,237,0.5);"></span><span class="tt-lbl">Total</span><span class="tt-val">'+fmt(chunk.total_tokens)+'</span></div>'
                        );
                    } else if(chunk.type === 'done'){
                        $('#testBtnText').html('<i class="fas fa-check"></i> 测试完成');
                        $('#testLoading').hide();
                        $('#testDot').removeClass('streaming');
                        $('#testOutput').find('.cursor-blink').remove();
                        $('#testTokens').show().html(
                            '<div class="test-token-item"><span class="tt-dot" style="background:#f97316;box-shadow:0 0 6px rgba(249,115,22,0.5);"></span><span class="tt-lbl">Prompt</span><span class="tt-val">'+fmt(chunk.prompt_tokens)+'</span></div>'+
                            '<div class="test-token-item"><span class="tt-dot" style="background:#06b6d4;box-shadow:0 0 6px rgba(6,182,212,0.5);"></span><span class="tt-lbl">Completion</span><span class="tt-val">'+fmt(chunk.completion_tokens)+'</span></div>'+
                            '<div class="test-token-item"><span class="tt-dot" style="background:#7c3aed;box-shadow:0 0 6px rgba(124,58,237,0.5);"></span><span class="tt-lbl">Total</span><span class="tt-val">'+fmt(chunk.total_tokens)+'</span></div>'
                        );
                        loadModels(currentPage);
                    } else if(chunk.type === 'error'){
                        $('#testOutput').html('<p style="color:#fca5a5;">错误: '+chunk.message+'</p>');
                        $('#testBtnText').html('<i class="fas fa-exclamation-triangle"></i> 测试失败');
                        $('#testLoading').hide();
                        $('#testDot').removeClass('streaming');
                    }
                } catch(e){}
            }
        }
    };

    xhr.onloadend = function(){
        $('#testBtnText').html('<i class="fas fa-play"></i> 运行测试');
        $('#testLoading').hide();
        $('#testDot').removeClass('streaming');
        if($('#testOutput').data('content')){
            $('#testOutput').find('.cursor-blink').remove();
        }
    };

    xhr.onerror = function(){
        $('#testOutput').html('<p style="color:#fca5a5;">网络请求失败，请检查模型配置</p>');
        $('#testBtnText').html('<i class="fas fa-exclamation-triangle"></i> 连接失败');
        $('#testLoading').hide();
        $('#testDot').removeClass('streaming');
    };

    xhr.send(JSON.stringify({model_id: parseInt(modelDbId), prompt: prompt}));
}

$(document).on('click', '.modal-overlay', function(e){
    if(e.target === this) closeModal();
});

$(document).on('keydown', function(e){
    if(e.key === 'Escape') closeModal();
});

layui.use(['element', 'layer'], function(){
    var layer = layui.layer;
    window.layer = layer;
    loadModels(1);
});
</script>
{% end %}
