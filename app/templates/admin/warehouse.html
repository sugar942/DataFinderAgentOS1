{% extends "base.html" %}
{% block body %}
<style>
    .wh-stats { display: flex; gap: 24px; margin-bottom: 16px; }
    .wh-stat { display: flex; align-items: center; gap: 10px; }
    .wh-stat .num { font-size: 22px; font-weight: 700; color: #4C1D95; }
    .wh-stat .lbl { font-size: 12px; color: #888; }
    .deep-badge { font-size: 11px; padding: 2px 10px; border-radius: 10px; font-weight: 600; }
    .deep-badge.yes { background: #D1FAE5; color: #065F46; }
    .deep-badge.no { background: #F3F4F6; color: #9CA3AF; }
    .source-tag { font-size: 11px; padding: 2px 10px; border-radius: 10px; background: #EDE9FE; color: #5B21B6; font-weight: 500; }

    /* Floating overlay */
    .float-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.3); z-index: 9997;
        opacity: 0; visibility: hidden; transition: all 0.3s;
    }
    .float-overlay.show { opacity: 1; visibility: visible; }

    /* Floating panel */
    .float-panel {
        position: fixed; top: 0; right: -560px; width: 540px; height: 100vh;
        background: #1a1a2e; box-shadow: -4px 0 40px rgba(0,0,0,0.4);
        z-index: 9998; transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
        display: flex; flex-direction: column;
    }
    .float-panel.open { right: 0; }
    .float-panel-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 16px 20px;
        background: linear-gradient(135deg, #16213e, #0f3460);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        color: #e0e0e0; flex-shrink: 0;
    }
    .float-panel-header h4 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
    .float-panel-close {
        width: 30px; height: 30px; border-radius: 50%; border: none;
        background: rgba(255,255,255,0.1); color: #aaa;
        cursor: pointer; font-size: 16px; transition: all 0.2s;
    }
    .float-panel-close:hover { background: rgba(255,255,255,0.2); color: #fff; }
    .float-panel-body { flex: 1; overflow-y: auto; padding: 20px; color: #ccc; }

    /* Panel sections */
    .dc-section { margin-bottom: 18px; }
    .dc-section-title {
        font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
        color: #7C3AED; margin-bottom: 10px; font-weight: 700;
    }

    /* Progress bar */
    .dc-progress-wrap { background: rgba(255,255,255,0.06); border-radius: 10px; height: 8px; overflow: hidden; margin: 8px 0; }
    .dc-progress-bar {
        height: 100%; border-radius: 10px;
        background: linear-gradient(90deg, #7C3AED, #a78bfa);
        transition: width 0.5s ease; width: 0%;
    }
    .dc-progress-bar.running { animation: progressPulse 1.5s ease-in-out infinite; }
    .dc-progress-bar.completed { background: linear-gradient(90deg, #059669, #10B981); }
    .dc-progress-bar.failed { background: linear-gradient(90deg, #DC2626, #EF4444); }
    @keyframes progressPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
    }

    .dc-status-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .dc-status { font-weight: 600; }
    .dc-status.pending { color: #F59E0B; }
    .dc-status.running { color: #3B82F6; }
    .dc-status.completed { color: #10B981; }
    .dc-status.failed { color: #EF4444; }

    /* Step indicator */
    .dc-step {
        padding: 10px 14px; background: rgba(124,58,237,0.08);
        border-left: 3px solid #7C3AED; border-radius: 0 8px 8px 0;
        font-size: 13px; color: #c4b5fd;
    }

    /* Employee info */
    .dc-employee {
        display: flex; align-items: center; gap: 10px; padding: 10px 14px;
        background: rgba(255,255,255,0.04); border-radius: 8px;
    }
    .dc-employee-icon {
        width: 36px; height: 36px; border-radius: 50%;
        background: linear-gradient(135deg, #7C3AED, #5B21B6);
        display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .dc-employee-name { font-weight: 600; font-size: 14px; color: #e0e0e0; }
    .dc-employee-tag { font-size: 11px; color: #888; }

    /* Log viewer */
    .dc-log-viewer {
        background: rgba(0,0,0,0.3); border-radius: 8px;
        padding: 12px; max-height: 200px; overflow-y: auto;
        font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
        font-size: 12px; line-height: 1.7;
    }
    .dc-log-viewer .log-line { padding: 1px 0; }
    .dc-log-viewer .log-line.info { color: #93c5fd; }
    .dc-log-viewer .log-line.success { color: #6ee7b7; }
    .dc-log-viewer .log-line.error { color: #fca5a5; }
    .dc-log-viewer .log-line.warn { color: #fcd34d; }

    /* Result preview */
    .dc-result-card {
        background: rgba(255,255,255,0.04); border-radius: 10px;
        padding: 14px; border: 1px solid rgba(255,255,255,0.06);
    }
    .dc-result-card .r-title { font-size: 15px; font-weight: 700; color: #e0e0e0; margin-bottom: 6px; }
    .dc-result-card .r-meta { font-size: 11px; color: #888; margin-bottom: 10px; display: flex; gap: 16px; }
    .dc-result-card .r-content {
        font-size: 13px; line-height: 1.7; color: #bbb;
        max-height: 300px; overflow-y: auto;
        white-space: pre-wrap; word-break: break-all;
    }

    /* Batch checkbox column */
    .wh-checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: #7C3AED; }

    /* Detail modal - dark theme */
    .detail-modal {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
        display: flex; align-items: center; justify-content: center;
        z-index: 9999; opacity: 0; visibility: hidden;
        transition: all 0.2s;
    }
    .detail-modal.active { opacity: 1; visibility: visible; }
    .detail-content {
        background: #fff; border-radius: 16px; width: 90%; max-width: 700px;
        max-height: 80vh; overflow-y: auto;
        transform: translateY(20px); transition: transform 0.25s;
    }
    .detail-modal.active .detail-content { transform: translateY(0); }
    .detail-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 20px 24px; border-bottom: 1px solid #f0eefa;
    }
    .detail-header h3 { margin: 0; font-size: 17px; color: #1F1531; font-weight: 700; }
    .detail-close {
        width: 32px; height: 32px; border-radius: 50%; border: none;
        background: #F5F3FA; color: #888; cursor: pointer; font-size: 18px;
    }
    .detail-body { padding: 20px 24px; }
    .detail-body .field { margin-bottom: 14px; }
    .detail-body .field-label { font-size: 11px; color: #999; text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
    .detail-body .field-value { font-size: 14px; color: #333; line-height: 1.6; word-break: break-all; }

    /* Batch bar */
    .batch-bar {
        display: flex; align-items: center; gap: 12px; padding: 10px 16px;
        background: #EDE9FE; border-radius: 8px; margin-bottom: 12px;
        font-size: 13px; color: #5B21B6; font-weight: 600;
    }
    .batch-bar.hidden { display: none; }
</style>

<div class="admin-card">
    <div class="wh-stats" id="whStats">
        <div class="wh-stat"><span class="num" id="stat-total">0</span><span class="lbl">条记录</span></div>
        <div class="wh-stat"><span class="num" id="stat-deep">0</span><span class="lbl">已深度采集</span></div>
    </div>

    <!-- Batch action bar -->
    <div class="batch-bar hidden" id="batchBar">
        <span id="batchCount">已选 0 条</span>
        <button class="layui-btn layui-btn-sm" id="batchDeepBtn" style="background:#F59E0B;border-color:#F59E0B;">
            <i class="fas fa-microscope"></i> 批量深度采集
        </button>
        <button class="layui-btn layui-btn-sm layui-btn-primary" id="clearBatchBtn">取消选择</button>
    </div>

    <div class="layui-row" style="margin-bottom: 16px;">
        <div class="layui-col-md8">
            <div class="layui-inline">
                <input type="text" id="search-keyword" placeholder="搜索标题/摘要/关键词..." class="layui-input" style="width: 240px;">
            </div>
            <div class="layui-inline">
                <input type="text" id="search-source" placeholder="按来源筛选..." class="layui-input" style="width: 180px;">
            </div>
            <button class="layui-btn layui-btn-normal" id="search-btn" style="background:#7C3AED;border-color:#7C3AED;">
                <i class="fas fa-search"></i> 搜索
            </button>
        </div>
    </div>

    <table id="warehouse-table" lay-filter="whTable"></table>
</div>

<!-- Detail Modal -->
<div class="detail-modal" id="detailModal">
    <div class="detail-content">
        <div class="detail-header">
            <h3>数据详情</h3>
            <button class="detail-close" onclick="closeDetail()">&times;</button>
        </div>
        <div class="detail-body" id="detailBody"></div>
    </div>
</div>

<!-- Deep Collect Panel -->
<div class="float-overlay" id="floatOverlay"></div>
<div class="float-panel" id="floatPanel">
    <div class="float-panel-header">
        <h4 id="floatPanelTitle">🔬 深度采集</h4>
        <button class="float-panel-close" onclick="closeFloatPanel()">&times;</button>
    </div>
    <div class="float-panel-body" id="floatPanelBody">
        <!-- Filled dynamically -->
    </div>
</div>
{% end %}
{% block script %}
<script>
layui.use(['table', 'layer'], function(){
    var table = layui.table;
    var layer = layui.layer;
    var selectedIds = {};
    var pollingTimer = null;
    var currentTaskId = null;

    function deepTpl(d){
        if(d.is_deep_collected === 1){
            return '<span class="deep-badge yes">是</span>';
        }
        return '<span class="deep-badge no">否</span>';
    }

    function sourceTpl(d){
        return d.source ? '<span class="source-tag">'+d.source+'</span>' : '-';
    }

    function titleTpl(d){
        var title = d.title || '无标题';
        if(d.url){
            return '<a href="'+d.url+'" target="_blank" style="color:#1a1a2e;text-decoration:none;">'+title+'</a>';
        }
        return title;
    }

    function checkboxTpl(d){
        var checked = selectedIds[d.id] ? 'checked' : '';
        return '<input type="checkbox" class="wh-checkbox" data-id="'+d.id+'" '+checked+' onclick="toggleSelect(this)">';
    }

    function actionTpl(d){
        var html = '<button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="view"><i class="fas fa-eye"></i> 查看</button> ';
        if(d.is_deep_collected === 1){
            html += '<button class="layui-btn layui-btn-xs" lay-event="viewDeep" style="background:#10B981;border-color:#10B981;"><i class="fas fa-file-alt"></i> 已采集</button> ';
        } else {
            html += '<button class="layui-btn layui-btn-xs" lay-event="deep" style="background:#F59E0B;border-color:#F59E0B;"><i class="fas fa-microscope"></i> 深度采集</button> ';
        }
        html += '<button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete"><i class="fas fa-trash"></i> 删除</button>';
        return html;
    }

    var tableIns = table.render({
        elem: '#warehouse-table',
        url: '/admin/api/warehouse',
        page: true,
        cols: [[
            {field:'id', title:'', width:44, templet: checkboxTpl, unresize: true},
            {field:'id', title:'ID', width:65},
            {field:'title', title:'标题', minWidth:200, templet: titleTpl},
            {field:'source', title:'来源', width:120, templet: sourceTpl},
            {field:'keyword', title:'关键词', width:100},
            {field:'is_deep_collected', title:'深度采集', width:100, templet: deepTpl, align:'center'},
            {field:'created_at', title:'入库时间', width:170},
            {title:'操作', width:210, templet: actionTpl, align:'center'}
        ]],
        defaultToolbar: [],
        where: {action: 'list'},
        parseData: function(res){
            if(res.code === 0 && res.data){
                var stats = res.data.stats || {};
                $('#stat-total').text(stats.total || 0);
                $('#stat-deep').text(stats.deep_collected || 0);
                return {code:0, msg:'', count:res.data.total, data:res.data.records};
            }
            return {code:res.code||1, msg:res.msg||'', count:0, data:[]};
        },
        done: function() {
            // Restore checkbox state after page change
            $('.wh-checkbox').each(function(){
                var id = $(this).data('id');
                if(selectedIds[id]) {
                    $(this).prop('checked', true);
                }
            });
            updateBatchBar();
        }
    });

    // Global checkbox toggle
    window.toggleSelect = function(cb) {
        var id = $(cb).data('id');
        if(cb.checked) {
            selectedIds[id] = true;
        } else {
            delete selectedIds[id];
        }
        updateBatchBar();
    };

    function updateBatchBar() {
        var count = Object.keys(selectedIds).length;
        if(count > 0) {
            $('#batchBar').removeClass('hidden');
            $('#batchCount').text('已选 ' + count + ' 条');
        } else {
            $('#batchBar').addClass('hidden');
        }
    }

    $('#clearBatchBtn').click(function(){
        selectedIds = {};
        $('.wh-checkbox').prop('checked', false);
        updateBatchBar();
    });

    $('#batchDeepBtn').click(function(){
        var ids = Object.keys(selectedIds);
        if(ids.length === 0) {
            layer.msg('请先选择数据', {icon:0});
            return;
        }
        layer.confirm('确定要对选中的 ' + ids.length + ' 条数据启动深度采集吗？', {icon:3}, function(index){
            layer.close(index);
            $.ajax({
                url: '/admin/api/deep_collect', type: 'POST', contentType: 'application/json',
                data: JSON.stringify({action: 'batch_start', record_ids: ids}),
                success: function(res){
                    if(res.code === 0){
                        layer.msg(res.msg, {icon:1});
                        selectedIds = {};
                        $('.wh-checkbox').prop('checked', false);
                        updateBatchBar();
                        tableIns.reload();
                    } else {
                        layer.msg(res.msg, {icon:2});
                    }
                }
            });
        });
    });

    $('#search-btn').click(function(){
        tableIns.reload({
            where: {
                action: 'list',
                keyword: $('#search-keyword').val(),
                source: $('#search-source').val()
            }
        });
    });

    $('#search-keyword, #search-source').on('keydown', function(e){
        if(e.key === 'Enter') $('#search-btn').click();
    });

    table.on('tool(whTable)', function(obj){
        var d = obj.data;
        if(obj.event === 'view'){
            showDetail(d);
        } else if(obj.event === 'deep'){
            startDeepCollect(d);
        } else if(obj.event === 'viewDeep'){
            viewDeepResult(d);
        } else if(obj.event === 'delete'){
            layer.confirm('确定要删除该条数据吗？', {icon:3}, function(index){
                layer.close(index);
                $.ajax({
                    url: '/admin/api/warehouse', type: 'POST', contentType: 'application/json',
                    data: JSON.stringify({action: 'delete', id: d.id}),
                    success: function(res){
                        if(res.code === 0){
                            tableIns.reload();
                            layer.msg('删除成功', {icon:1});
                        } else { layer.msg(res.msg, {icon:2}); }
                    }
                });
            });
        }
    });

    // ========== Detail Modal ==========
    function showDetail(d){
        var html = '';
        html += '<div class="field"><div class="field-label">标题</div><div class="field-value">'+(d.title||'-')+'</div></div>';
        html += '<div class="field"><div class="field-label">来源</div><div class="field-value">'+(d.source||'-')+'</div></div>';
        html += '<div class="field"><div class="field-label">关键词</div><div class="field-value">'+(d.keyword||'-')+'</div></div>';
        html += '<div class="field"><div class="field-label">URL</div><div class="field-value"><a href="'+(d.url||'#')+'" target="_blank">'+(d.url||'-')+'</a></div></div>';
        html += '<div class="field"><div class="field-label">摘要</div><div class="field-value">'+(d.summary||'-')+'</div></div>';
        html += '<div class="field"><div class="field-label">内容</div><div class="field-value">'+(d.content||'-')+'</div></div>';
        html += '<div class="field"><div class="field-label">深度采集</div><div class="field-value">'+(d.is_deep_collected===1?'是':'否')+'</div></div>';
        if(d.deep_collect_time){
            html += '<div class="field"><div class="field-label">深度采集时间</div><div class="field-value">'+d.deep_collect_time+'</div></div>';
        }
        html += '<div class="field"><div class="field-label">入库时间</div><div class="field-value">'+(d.created_at||'-')+'</div></div>';
        $('#detailBody').html(html);
        $('#detailModal').addClass('active');
    }

    window.closeDetail = function(){
        $('#detailModal').removeClass('active');
    };

    $('#detailModal').on('click', function(e){
        if(e.target === this) closeDetail();
    });

    // ========== Deep Collect Panel ==========

    function getLogClass(line) {
        if (!line) return 'info';
        if (line.indexOf('[ERROR]') !== -1) return 'error';
        if (line.indexOf('[SUCCESS]') !== -1) return 'success';
        if (line.indexOf('[WARN]') !== -1) return 'warn';
        return 'info';
    }

    function getStatusClass(status) {
        if (status === 'completed') return 'completed';
        if (status === 'failed') return 'failed';
        if (status === 'running') return 'running';
        return 'pending';
    }

    function renderPanelContent(task) {
        var status = task.status || 'pending';
        var progress = task.progress || 0;
        var step = task.step || '等待中...';
        var logs = task.logs_parsed || [];
        var employeeName = task.employee_name || '-';
        var error = task.error || '';

        var barExtraClass = '';
        if (status === 'running') barExtraClass = 'running';
        else if (status === 'completed') barExtraClass = 'completed';
        else if (status === 'failed') barExtraClass = 'failed';

        var html = '';

        // Employee info
        html += '<div class="dc-section">';
        html += '<div class="dc-section-title">调度数字员工</div>';
        html += '<div class="dc-employee">';
        html += '<div class="dc-employee-icon">🕷️</div>';
        html += '<div><div class="dc-employee-name">'+escapeHtml(employeeName)+'</div>';
        html += '<div class="dc-employee-tag">crawl4ai 浏览器引擎</div></div>';
        html += '</div></div>';

        // Status
        html += '<div class="dc-section">';
        html += '<div class="dc-section-title">任务状态</div>';
        html += '<div class="dc-status-row">';
        html += '<span class="dc-status '+getStatusClass(status)+'">'+statusText(status)+'</span>';
        html += '<span style="font-size:12px;color:#888;">'+progress+'%</span>';
        html += '</div>';
        html += '<div class="dc-progress-wrap"><div class="dc-progress-bar '+barExtraClass+'" style="width:'+progress+'%"></div></div>';
        html += '<div class="dc-step">'+escapeHtml(step)+'</div>';
        if(error){
            html += '<div style="margin-top:8px;padding:10px;background:rgba(220,38,38,0.1);border-radius:6px;color:#fca5a5;font-size:12px;">'+escapeHtml(error)+'</div>';
        }
        html += '</div>';

        // Logs
        html += '<div class="dc-section">';
        html += '<div class="dc-section-title">执行日志</div>';
        html += '<div class="dc-log-viewer" id="dcLogViewer">';
        if(logs.length === 0){
            html += '<div class="log-line info">等待任务启动...</div>';
        } else {
            for(var i = 0; i < logs.length; i++){
                html += '<div class="log-line '+getLogClass(logs[i])+'">'+escapeHtml(logs[i])+'</div>';
            }
        }
        html += '</div></div>';

        // Action buttons
        html += '<div style="display:flex;gap:10px;margin-top:4px;">';
        if(status === 'completed'){
            html += '<button class="layui-btn layui-btn-sm" style="background:#10B981;border-color:#10B981;" onclick="viewDeepResultById('+task.result_id+','+task.warehouse_id+')"><i class="fas fa-file-alt"></i> 查看采集结果</button>';
        }
        if(status === 'failed' || status === 'completed'){
            html += '<button class="layui-btn layui-btn-sm layui-btn-primary" style="color:#ccc;border-color:#555;" onclick="retryDeepCollect('+task.warehouse_id+')"><i class="fas fa-redo"></i> 重新采集</button>';
        }
        html += '</div>';

        return html;
    }

    function statusText(s) {
        var map = {pending:'等待中', running:'采集中', completed:'采集完成', failed:'采集失败'};
        return map[s] || s;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function pollTaskStatus(taskId) {
        $.ajax({
            url: '/admin/api/deep_collect?action=status&task_id=' + taskId,
            type: 'GET',
            success: function(res) {
                if(res.code === 0 && res.data){
                    var task = res.data;
                    $('#floatPanelBody').html(renderPanelContent(task));
                    var logViewer = document.getElementById('dcLogViewer');
                    if(logViewer) {
                        logViewer.scrollTop = logViewer.scrollHeight;
                    }
                    if(task.status === 'running' || task.status === 'pending'){
                        pollingTimer = setTimeout(function(){ pollTaskStatus(taskId); }, 1500);
                    } else {
                        // Reload table to reflect deep_collected status change
                        tableIns.reload();
                    }
                }
            },
            error: function() {
                pollingTimer = setTimeout(function(){ pollTaskStatus(taskId); }, 3000);
            }
        });
    }

    function startDeepCollect(d) {
        currentTaskId = null;
        if(pollingTimer) { clearTimeout(pollingTimer); pollingTimer = null; }

        $('#floatPanelTitle').text('🔬 深度采集 - ' + (d.title||'').substring(0, 30));
        $('#floatPanelBody').html(
            '<div style="text-align:center;padding:60px 20px;color:#888;">'+
            '<div style="font-size:40px;margin-bottom:16px;">⏳</div>'+
            '<div>正在启动深度采集任务...</div></div>'
        );
        $('#floatPanel').addClass('open');
        $('#floatOverlay').addClass('show');

        $.ajax({
            url: '/admin/api/deep_collect', type: 'POST', contentType: 'application/json',
            data: JSON.stringify({action: 'start', record_id: d.id}),
            success: function(res){
                if(res.code === 0 && res.data){
                    currentTaskId = res.data.task_id;
                    pollTaskStatus(currentTaskId);
                } else {
                    $('#floatPanelBody').html(
                        '<div style="text-align:center;padding:60px 20px;">'+
                        '<div style="font-size:40px;margin-bottom:16px;">❌</div>'+
                        '<div style="color:#fca5a5;">启动失败: '+escapeHtml(res.msg)+'</div></div>'
                    );
                }
            },
            error: function(){
                $('#floatPanelBody').html(
                    '<div style="text-align:center;padding:60px 20px;color:#fca5a5;">请求失败，请检查服务状态</div>'
                );
            }
        });
    }

    // View deep collect result (for already-collected records)
    function viewDeepResult(d) {
        $('#floatPanelTitle').text('📄 深度采集结果 - ' + (d.title||'').substring(0, 30));
        $('#floatPanelBody').html(
            '<div style="text-align:center;padding:40px;color:#888;">加载中...</div>'
        );
        $('#floatPanel').addClass('open');
        $('#floatOverlay').addClass('show');

        $.ajax({
            url: '/admin/api/deep_collect?action=result&warehouse_id=' + d.id,
            type: 'GET',
            success: function(res){
                if(res.code === 0 && res.data){
                    renderResultContent(res.data);
                } else {
                    $('#floatPanelBody').html(
                        '<div style="text-align:center;padding:40px;color:#fca5a5;">未找到深度采集结果</div>'
                    );
                }
            }
        });
    }

    window.viewDeepResultById = function(resultId, warehouseId) {
        $.ajax({
            url: '/admin/api/deep_collect?action=result&warehouse_id=' + warehouseId,
            type: 'GET',
            success: function(res){
                if(res.code === 0 && res.data){
                    renderResultContent(res.data);
                } else {
                    layer.msg('未找到采集结果', {icon:2});
                }
            }
        });
    };

    window.retryDeepCollect = function(warehouseId) {
        if(pollingTimer) { clearTimeout(pollingTimer); pollingTimer = null; }
        $('#floatPanelBody').html(
            '<div style="text-align:center;padding:60px 20px;color:#888;">'+
            '<div style="font-size:40px;margin-bottom:16px;">⏳</div>'+
            '<div>正在重新启动深度采集任务...</div></div>'
        );
        $.ajax({
            url: '/admin/api/deep_collect', type: 'POST', contentType: 'application/json',
            data: JSON.stringify({action: 'start', record_id: warehouseId}),
            success: function(res){
                if(res.code === 0 && res.data){
                    currentTaskId = res.data.task_id;
                    pollTaskStatus(currentTaskId);
                } else {
                    $('#floatPanelBody').html(
                        '<div style="text-align:center;padding:40px;color:#fca5a5;">'+escapeHtml(res.msg)+'</div>'
                    );
                }
            }
        });
    };

    function renderResultContent(result) {
        var title = result.title || '无标题';
        var wordCount = result.word_count || 0;
        var collectedAt = result.collected_at || '';
        var content = result.content || '';
        var url = result.url || '';
        var markdown = result.markdown || '';

        var html = '';
        html += '<div class="dc-section"><div class="dc-section-title">采集结果</div>';
        html += '<div class="dc-result-card">';
        html += '<div class="r-title">'+escapeHtml(title)+'</div>';
        html += '<div class="r-meta">';
        html += '<span>📝 ' + wordCount + ' 字</span>';
        html += '<span>🕐 ' + escapeHtml(collectedAt) + '</span>';
        if(url) html += '<span>🔗 <a href="'+escapeHtml(url)+'" target="_blank" style="color:#93c5fd;">来源</a></span>';
        html += '</div>';

        // Tabs for content/markdown
        html += '<div style="display:flex;gap:8px;margin-bottom:10px;">';
        html += '<button class="layui-btn layui-btn-xs layui-btn-normal" onclick="switchResultTab(\'text\')" id="tab-text" style="background:#7C3AED;border-color:#7C3AED;">正文</button>';
        html += '<button class="layui-btn layui-btn-xs layui-btn-primary" onclick="switchResultTab(\'markdown\')" id="tab-markdown" style="color:#ccc;border-color:#555;">Markdown</button>';
        html += '</div>';

        html += '<div class="r-content" id="resultContent">'+escapeHtml(content)+'</div>';
        html += '<div class="r-content" id="resultMarkdown" style="display:none;">'+escapeHtml(markdown)+'</div>';
        html += '</div></div>';

        $('#floatPanelBody').html(html);
    }

    window.switchResultTab = function(tab) {
        if(tab === 'text') {
            $('#resultContent').show();
            $('#resultMarkdown').hide();
            $('#tab-text').attr('style', 'background:#7C3AED;border-color:#7C3AED;');
            $('#tab-markdown').attr('style', 'color:#ccc;border-color:#555;');
        } else {
            $('#resultContent').hide();
            $('#resultMarkdown').show();
            $('#tab-markdown').attr('style', 'background:#7C3AED;border-color:#7C3AED;');
            $('#tab-text').attr('style', 'color:#ccc;border-color:#555;');
        }
    };

    window.closeFloatPanel = function(){
        $('#floatPanel').removeClass('open');
        $('#floatOverlay').removeClass('show');
        if(pollingTimer) {
            clearTimeout(pollingTimer);
            pollingTimer = null;
        }
    };

    $('#floatOverlay').on('click', function(){
        closeFloatPanel();
    });

    $(document).on('keydown', function(e){
        if(e.key === 'Escape'){
            closeDetail();
            closeFloatPanel();
        }
    });
});
</script>
{% end %}
