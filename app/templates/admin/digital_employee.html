{% extends "base.html" %}
{% block body %}
<style>
    .admin-content { background: #0a0a14; }

    .de-page { position: relative; }
    .de-bg {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background:
            radial-gradient(ellipse at 20% 30%, rgba(6,182,212,0.06) 0%, transparent 55%),
            radial-gradient(ellipse at 70% 60%, rgba(124,58,237,0.07) 0%, transparent 55%),
            radial-gradient(ellipse at 40% 80%, rgba(16,185,129,0.04) 0%, transparent 45%);
        pointer-events: none;
        z-index: 0;
    }
    .de-page > * { position: relative; z-index: 1; }

    /* Hero */
    .de-hero {
        background: linear-gradient(135deg, #0f0f23 0%, #1a1040 40%, #0d1b2a 100%);
        border: 1px solid rgba(6,182,212,0.2);
        border-radius: 20px;
        padding: 28px 36px;
        margin-bottom: 24px;
        position: relative;
        overflow: hidden;
    }
    .de-hero::before {
        content: '';
        position: absolute;
        top: -40%; right: -15%;
        width: 360px; height: 360px;
        background: radial-gradient(circle, rgba(6,182,212,0.12) 0%, transparent 70%);
        pointer-events: none;
    }
    .de-hero h3 {
        margin: 0 0 6px 0;
        font-size: 22px;
        font-weight: 700;
        background: linear-gradient(135deg, #67e8f9, #22d3ee, #06b6d4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    .de-hero p {
        margin: 0;
        font-size: 13px;
        color: rgba(255,255,255,0.45);
    }
    .hero-actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
        position: relative;
        flex-wrap: wrap;
    }
    .btn-neon {
        height: 42px;
        padding: 0 24px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.25s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    .btn-neon.primary {
        background: linear-gradient(135deg, #06b6d4, #0891b2);
        color: #fff;
        box-shadow: 0 0 20px rgba(6,182,212,0.3), 0 4px 12px rgba(8,145,178,0.4);
    }
    .btn-neon.primary:hover {
        box-shadow: 0 0 30px rgba(6,182,212,0.5), 0 6px 20px rgba(8,145,178,0.5);
        transform: translateY(-2px);
    }
    .btn-neon.secondary {
        background: rgba(255,255,255,0.06);
        color: #67e8f9;
        border: 1px solid rgba(6,182,212,0.3);
    }
    .btn-neon.secondary:hover {
        background: rgba(6,182,212,0.15);
        border-color: rgba(6,182,212,0.5);
        box-shadow: 0 0 16px rgba(6,182,212,0.2);
    }
    .search-input-dark {
        height: 42px;
        width: 260px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.05);
        color: #e2d9f3;
        font-size: 13px;
        outline: none;
        transition: all 0.2s;
    }
    .search-input-dark::placeholder { color: rgba(255,255,255,0.3); }
    .search-input-dark:focus {
        border-color: rgba(6,182,212,0.5);
        box-shadow: 0 0 0 3px rgba(6,182,212,0.1);
        background: rgba(255,255,255,0.08);
    }

    /* Stats */
    .stats-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 24px;
    }
    .stat-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 20px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
    }
    .stat-card:hover {
        transform: translateY(-3px);
        border-color: rgba(6,182,212,0.3);
    }
    .stat-icon {
        width: 48px; height: 48px;
        border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; color: #fff;
        flex-shrink: 0;
    }
    .stat-icon.total { background: linear-gradient(135deg, #06b6d4, #0891b2); box-shadow: 0 0 20px rgba(6,182,212,0.3); }
    .stat-icon.llm { background: linear-gradient(135deg, #7c3aed, #6d28d9); box-shadow: 0 0 20px rgba(124,58,237,0.3); }
    .stat-icon.api { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 0 20px rgba(16,185,129,0.3); }
    .stat-icon.active { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 0 20px rgba(245,158,11,0.3); }
    .stat-value {
        font-size: 26px;
        font-weight: 800;
        color: #f5f3fa;
        letter-spacing: -0.5px;
    }
    .stat-label {
        font-size: 11px;
        color: rgba(255,255,255,0.4);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 2px;
    }

    /* Cards Grid */
    .de-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 20px;
    }
    .de-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 24px;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
    }
    .de-card::after {
        content: '';
        position: absolute;
        top: -1px; left: 30px; right: 30px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(6,182,212,0.3), transparent);
        opacity: 0;
        transition: opacity 0.3s;
    }
    .de-card:hover {
        transform: translateY(-6px);
        border-color: rgba(6,182,212,0.3);
        box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(6,182,212,0.08) inset;
    }
    .de-card:hover::after { opacity: 1; }
    .de-card.disabled-card { opacity: 0.4; }
    .de-card.disabled-card:hover { opacity: 0.6; transform: translateY(-3px); }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 14px;
    }
    .card-header-left {
        display: flex;
        align-items: center;
        gap: 14px;
    }
    .card-icon {
        width: 48px; height: 48px;
        border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
    }
    .card-icon.llm {
        background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(109,40,217,0.2));
        color: #c4b5fd;
        border: 1px solid rgba(124,58,237,0.25);
    }
    .card-icon.api {
        background: linear-gradient(135deg, rgba(16,185,129,0.3), rgba(5,150,105,0.2));
        color: #6ee7b7;
        border: 1px solid rgba(16,185,129,0.25);
    }
    .card-name {
        font-size: 16px;
        font-weight: 700;
        color: #f5f3fa;
    }
    .card-code {
        font-size: 11px;
        color: rgba(255,255,255,0.35);
        font-family: 'SF Mono', 'Consolas', monospace;
        margin-top: 2px;
    }
    .badge-group {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
    }
    .badge {
        font-size: 10px;
        padding: 3px 12px;
        border-radius: 20px;
        font-weight: 700;
        letter-spacing: 0.3px;
    }
    .badge.llm-badge {
        background: rgba(124,58,237,0.2);
        color: #c4b5fd;
        border: 1px solid rgba(124,58,237,0.3);
    }
    .badge.api-badge {
        background: rgba(16,185,129,0.2);
        color: #6ee7b7;
        border: 1px solid rgba(16,185,129,0.3);
    }
    .badge.active-badge {
        background: rgba(16,185,129,0.15);
        color: #6ee7b7;
        border: 1px solid rgba(16,185,129,0.25);
    }
    .badge.inactive-badge {
        background: rgba(239,68,68,0.15);
        color: #fca5a5;
        border: 1px solid rgba(239,68,68,0.25);
    }

    .card-desc {
        font-size: 12px;
        color: rgba(255,255,255,0.4);
        line-height: 1.5;
        margin-bottom: 14px;
    }

    /* Config section */
    .config-block {
        background: rgba(0,0,0,0.25);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 14px;
        border: 1px solid rgba(255,255,255,0.05);
        font-size: 12px;
        color: rgba(255,255,255,0.45);
        line-height: 1.6;
    }
    .config-block .lbl {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: rgba(255,255,255,0.3);
        margin-bottom: 6px;
    }
    .config-block .val {
        color: rgba(255,255,255,0.65);
        font-family: 'SF Mono', 'Consolas', monospace;
        word-break: break-all;
    }
    .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }
    .tag {
        font-size: 10px;
        padding: 3px 10px;
        border-radius: 6px;
        font-weight: 500;
    }
    .tag.llm-tag {
        background: rgba(124,58,237,0.12);
        color: #a78bfa;
        border: 1px solid rgba(124,58,237,0.15);
    }
    .tag.api-tag {
        background: rgba(16,185,129,0.12);
        color: #6ee7b7;
        border: 1px solid rgba(16,185,129,0.15);
    }
    .tag.warn-tag {
        background: rgba(245,158,11,0.12);
        color: #fcd34d;
        border: 1px solid rgba(245,158,11,0.15);
    }

    /* Card actions */
    .card-actions {
        display: flex;
        gap: 8px;
        padding-top: 16px;
        border-top: 1px solid rgba(255,255,255,0.06);
    }
    .card-btn {
        flex: 1;
        height: 38px;
        border: none;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }
    .card-btn.primary {
        background: linear-gradient(135deg, #06b6d4, #0891b2);
        color: #fff;
    }
    .card-btn.primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 20px rgba(6,182,212,0.4);
    }
    .card-btn.secondary {
        background: rgba(255,255,255,0.05);
        color: #67e8f9;
        border: 1px solid rgba(255,255,255,0.08);
    }
    .card-btn.secondary:hover {
        background: rgba(6,182,212,0.15);
        border-color: rgba(6,182,212,0.3);
    }
    .card-btn.danger {
        background: rgba(239,68,68,0.08);
        color: #fca5a5;
        border: 1px solid rgba(239,68,68,0.15);
    }
    .card-btn.danger:hover {
        background: rgba(239,68,68,0.18);
        border-color: rgba(239,68,68,0.3);
        box-shadow: 0 0 16px rgba(239,68,68,0.2);
    }

    /* Empty state */
    .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: rgba(255,255,255,0.3);
        grid-column: 1/-1;
    }
    .empty-state i {
        font-size: 56px;
        display: block;
        margin-bottom: 16px;
        opacity: 0.5;
    }
    .empty-state p { font-size: 15px; margin: 0; }

    /* Pagination */
    .pagination-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid rgba(255,255,255,0.06);
    }
    .pagination-bar button {
        padding: 8px 18px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px;
        background: rgba(255,255,255,0.04);
        color: rgba(255,255,255,0.6);
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s;
    }
    .pagination-bar button:hover {
        border-color: rgba(6,182,212,0.4);
        color: #67e8f9;
        background: rgba(6,182,212,0.1);
    }
    .pagination-bar button:disabled { opacity: 0.3; cursor: not-allowed; }
    .pagination-bar .page-info { font-size: 13px; color: rgba(255,255,255,0.4); }

    /* ===== Modal ===== */
    .modal-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(8px);
        display: flex; align-items: center; justify-content: center;
        z-index: 9999; opacity: 0; visibility: hidden;
        transition: all 0.25s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content {
        background: linear-gradient(180deg, #1a1040 0%, #0f0f23 100%);
        border: 1px solid rgba(6,182,212,0.2);
        border-radius: 20px;
        width: 92%; max-width: 720px;
        max-height: 90vh; overflow-y: auto;
        transform: translateY(20px); transition: transform 0.3s;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(6,182,212,0.12);
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .modal-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 22px 28px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.02);
        border-radius: 20px 20px 0 0;
    }
    .modal-header h2 {
        color: #f5f3fa;
        font-size: 18px;
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .modal-header h2 i { color: #06b6d4; font-size: 20px; }
    .modal-close {
        width: 34px; height: 34px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.05);
        color: rgba(255,255,255,0.5);
        font-size: 18px; cursor: pointer;
        transition: all 0.15s;
        display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover {
        background: rgba(239,68,68,0.2);
        border-color: rgba(239,68,68,0.3);
        color: #fca5a5;
    }
    .modal-body { padding: 24px 28px; }
    .modal-footer {
        display: flex; justify-content: flex-end; gap: 10px;
        padding: 18px 28px;
        border-top: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.02);
        border-radius: 0 0 20px 20px;
    }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-group label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: rgba(255,255,255,0.5);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        height: 44px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.05);
        color: #e2d9f3;
        font-size: 13px;
        transition: all 0.2s;
        box-sizing: border-box;
        outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
        border-color: rgba(6,182,212,0.5);
        box-shadow: 0 0 0 3px rgba(6,182,212,0.1);
        background: rgba(255,255,255,0.08);
    }
    .form-group select { background-color: #12102a; }
    .form-group select option { background: #1a1040; color: #e2d9f3; }
    .form-group textarea { height: 80px; padding: 12px 16px; resize: vertical; font-family: inherit; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    .form-section {
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        padding: 16px;
        margin-top: 16px;
        background: rgba(255,255,255,0.02);
    }
    .form-section legend {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: rgba(255,255,255,0.4);
        margin-bottom: 12px;
        padding: 0 8px;
    }

    /* Type selector */
    .type-selector {
        display: flex;
        gap: 12px;
        margin-bottom: 18px;
    }
    .type-option {
        flex: 1;
        border: 2px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        padding: 16px;
        text-align: center;
        cursor: pointer;
        transition: all 0.25s;
        background: rgba(255,255,255,0.02);
    }
    .type-option:hover {
        border-color: rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.04);
    }
    .type-option.selected.llm-sel {
        border-color: rgba(124,58,237,0.5);
        background: rgba(124,58,237,0.1);
        box-shadow: 0 0 20px rgba(124,58,237,0.2);
    }
    .type-option.selected.api-sel {
        border-color: rgba(16,185,129,0.5);
        background: rgba(16,185,129,0.1);
        box-shadow: 0 0 20px rgba(16,185,129,0.2);
    }
    .type-option i {
        font-size: 28px;
        display: block;
        margin-bottom: 8px;
    }
    .type-option .t-name {
        font-size: 14px;
        font-weight: 700;
        color: #f5f3fa;
    }
    .type-option .t-desc {
        font-size: 11px;
        color: rgba(255,255,255,0.35);
        margin-top: 4px;
    }
    .type-option.llm-sel i { color: #a78bfa; }
    .type-option.api-sel i { color: #6ee7b7; }

    .hidden-section { display: none; }

    /* Test area */
    .test-block {
        margin-top: 16px;
        border: 1px solid rgba(6,182,212,0.15);
        border-radius: 14px;
        overflow: hidden;
        background: rgba(0,0,0,0.3);
    }
    .test-block-header {
        padding: 12px 18px;
        background: rgba(6,182,212,0.08);
        border-bottom: 1px solid rgba(6,182,212,0.12);
        font-size: 12px;
        font-weight: 600;
        color: #67e8f9;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .test-block-body { padding: 16px; }
    .test-output-dark {
        min-height: 60px;
        max-height: 260px;
        overflow-y: auto;
        padding: 14px;
        border-radius: 10px;
        background: rgba(0,0,0,0.4);
        font-size: 13px;
        line-height: 1.6;
        color: #e2d9f3;
        border: 1px solid rgba(255,255,255,0.06);
        margin-top: 10px;
        font-family: 'SF Mono', 'Consolas', monospace;
        white-space: pre-wrap;
        word-break: break-all;
    }

    @media (max-width: 768px) {
        .stats-row { grid-template-columns: repeat(2, 1fr); }
        .de-grid { grid-template-columns: 1fr; }
        .form-row, .form-row-3 { grid-template-columns: 1fr; }
        .type-selector { flex-direction: column; }
        .hero-actions { flex-wrap: wrap; }
        .search-input-dark { width: 100%; }
    }
</style>

<div class="de-page">
<div class="de-bg"></div>

<div class="de-hero">
    <h3><i class="fas fa-user-robot"></i> 数字员工</h3>
    <p>LLM 智能体 + API 接口服务 · 可调度数字化劳动力 · 支持 @xxx 交互</p>
    <div class="hero-actions">
        <input type="text" class="search-input-dark" id="searchInput" placeholder="搜索名称、编码...">
        <button class="btn-neon secondary" id="searchBtn"><i class="fas fa-search"></i> 搜索</button>
        <button class="btn-neon primary" id="addBtn"><i class="fas fa-plus"></i> 创建数字员工</button>
    </div>
</div>

<div class="stats-row" id="statsRow">
    <div class="stat-card">
        <div class="stat-icon total"><i class="fas fa-users"></i></div>
        <div><div class="stat-value" id="stat-total">0</div><div class="stat-label">员工总数</div></div>
    </div>
    <div class="stat-card">
        <div class="stat-icon llm"><i class="fas fa-brain"></i></div>
        <div><div class="stat-value" id="stat-llm">0</div><div class="stat-label">LLM 智能体</div></div>
    </div>
    <div class="stat-card">
        <div class="stat-icon api"><i class="fas fa-plug"></i></div>
        <div><div class="stat-value" id="stat-api">0</div><div class="stat-label">API 服务</div></div>
    </div>
    <div class="stat-card">
        <div class="stat-icon active"><i class="fas fa-check-circle"></i></div>
        <div><div class="stat-value" id="stat-active">0</div><div class="stat-label">已激活</div></div>
    </div>
</div>

<div class="de-grid" id="deGrid">
    <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i><p>加载中...</p></div>
</div>

<div class="pagination-bar" id="pagination" style="display:none;"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="deModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle"><i class="fas fa-user-robot"></i> 创建数字员工</h2>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="deForm" onsubmit="return false;">
                <input type="hidden" id="empId">

                <!-- Type selector -->
                <label style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;display:block;">员工类型</label>
                <div class="type-selector">
                    <div class="type-option llm-sel selected" id="typeLLM" onclick="selectType('llm')">
                        <i class="fas fa-brain"></i>
                        <div class="t-name">LLM 智能体</div>
                        <div class="t-desc">模型 + Prompt + 技能</div>
                    </div>
                    <div class="type-option api-sel" id="typeAPI" onclick="selectType('api')">
                        <i class="fas fa-plug"></i>
                        <div class="t-name">API 服务</div>
                        <div class="t-desc">HTTP 接口 + 参数</div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>名称 *</label>
                        <input type="text" id="ename" required placeholder="例如：采集专员">
                    </div>
                    <div class="form-group">
                        <label>编码 * (@引用)</label>
                        <input type="text" id="ecode" required placeholder="例如：collector">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>图标</label>
                        <input type="text" id="eicon" placeholder="例如：fas fa-robot" value="fas fa-robot">
                    </div>
                    <div class="form-group">
                        <label>排序</label>
                        <input type="number" id="esort" value="0" min="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="edesc" placeholder="数字员工的职责和能力描述..."></textarea>
                </div>

                <!-- LLM section -->
                <div class="form-section" id="llmSection">
                    <legend><i class="fas fa-brain"></i> LLM 配置</legend>
                    <div class="form-row">
                        <div class="form-group">
                            <label>指派模型</label>
                            <select id="emodelId">
                                <option value="0">系统默认模型</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Crawl4AI</label>
                            <select id="ecrawl4ai">
                                <option value="0">关闭</option>
                                <option value="1">启用</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>System Prompt</label>
                        <textarea id="eprompt" placeholder="定义数字员工的行为和能力..." style="height:100px;"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Skill 配置 (JSON)</label>
                        <textarea id="eskillConfig" placeholder='{"skills": ["data_collection", "report_gen"]}' style="height:60px;">{}</textarea>
                    </div>
                </div>

                <!-- API section -->
                <div class="form-section hidden-section" id="apiSection">
                    <legend><i class="fas fa-plug"></i> API 配置</legend>
                    <div class="form-row">
                        <div class="form-group">
                            <label>API URL *</label>
                            <input type="text" id="eapiUrl" placeholder="https://api.example.com/data">
                        </div>
                        <div class="form-group">
                            <label>请求方法</label>
                            <select id="eapiMethod">
                                <option value="GET">GET</option>
                                <option value="POST">POST</option>
                                <option value="PUT">PUT</option>
                                <option value="DELETE">DELETE</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>请求参数 (JSON)</label>
                        <textarea id="eapiParams" placeholder='{"key": "value"}' style="height:60px;">{}</textarea>
                    </div>
                    <div class="form-group">
                        <label>请求头 (JSON)</label>
                        <textarea id="eapiHeaders" placeholder='{"Authorization": "Bearer xxx"}' style="height:60px;">{}</textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>请求体 (JSON, POST/PUT时使用)</label>
                            <textarea id="eapiBody" placeholder='{"query": "..."}' style="height:60px;">{}</textarea>
                        </div>
                        <div class="form-group">
                            <label>响应类型</label>
                            <select id="eresponseType">
                                <option value="json">JSON</option>
                                <option value="text">Text</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Test area (edit mode) -->
                <div class="test-block" id="testBlock" style="display:none;">
                    <div class="test-block-header">
                        <span class="pulse-dot" id="testDot" style="width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 8px rgba(16,185,129,0.5);"></span>
                        功能测试
                    </div>
                    <div class="test-block-body">
                        <textarea class="search-input-dark" id="testInput" placeholder="输入测试消息..." style="width:100%;min-height:50px;box-sizing:border-box;"></textarea>
                        <button type="button" class="btn-neon secondary" onclick="runTest()" id="testBtn" style="margin-top:10px;">
                            <i class="fas fa-play"></i> 运行测试
                        </button>
                        <div class="test-output-dark" id="testOutput" style="display:none;"></div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-neon secondary" onclick="closeModal()">取消</button>
            <button class="btn-neon primary" onclick="submitForm()">保存</button>
        </div>
    </div>
</div>
{% end %}

{% block script %}
<script>
var allEmployees = [];
var currentPage = 1;
var totalPages = 1;
var pageSize = 12;
var currentType = 'llm';

function selectType(type) {
    currentType = type;
    $('#typeLLM').toggleClass('selected', type === 'llm');
    $('#typeAPI').toggleClass('selected', type === 'api');
    $('#llmSection').toggleClass('hidden-section', type !== 'llm');
    $('#apiSection').toggleClass('hidden-section', type !== 'api');
}

function loadEmployees(page) {
    page = page || 1;
    currentPage = page;
    var keyword = $('#searchInput').val() || '';
    $.get('/admin/api/digital_employees', {keyword: keyword, page: page, page_size: pageSize}, function(res) {
        if (res.code === 0) {
            allEmployees = res.data || [];
            var total = res.count || 0;
            totalPages = Math.ceil(total / pageSize) || 1;

            var llmCount = 0, apiCount = 0, activeCount = 0;
            layui.each(allEmployees, function(i, e) {
                if (e.type === 'llm') llmCount++;
                else apiCount++;
                if (e.status === 1) activeCount++;
            });
            $('#stat-total').text(total);
            $('#stat-llm').text(llmCount);
            $('#stat-api').text(apiCount);
            $('#stat-active').text(activeCount);

            renderCards();
            renderPagination();
        }
    });
}

function renderCards() {
    var html = '';
    if (allEmployees.length === 0) {
        html = '<div class="empty-state"><i class="fas fa-user-robot"></i><p>暂无数字员工<br><small style="color:rgba(255,255,255,0.2);">点击上方「创建数字员工」添加第一个数字化劳动力</small></p></div>';
    }
    layui.each(allEmployees, function(i, e) {
        var isLLM = e.type === 'llm';
        var enabled = e.status === 1;
        var cls = enabled ? '' : ' disabled-card';
        var iconCls = isLLM ? 'llm' : 'api';
        var typeBadgeCls = isLLM ? 'llm-badge' : 'api-badge';
        var typeLabel = isLLM ? 'LLM 智能体' : 'API 服务';
        var statusBadgeCls = enabled ? 'active-badge' : 'inactive-badge';
        var statusLabel = enabled ? '● 已激活' : '○ 已禁用';

        html += '<div class="de-card' + cls + '">';

        // Header
        html += '<div class="card-header">';
        html += '<div class="card-header-left">';
        html += '<div class="card-icon ' + iconCls + '"><i class="' + (e.icon || 'fas fa-robot') + '"></i></div>';
        html += '<div><div class="card-name">' + (e.name || '') + '</div><div class="card-code">@' + (e.code || '') + '</div></div>';
        html += '</div>';
        html += '<div class="badge-group">';
        html += '<span class="badge ' + typeBadgeCls + '">' + typeLabel + '</span>';
        html += '<span class="badge ' + statusBadgeCls + '">' + statusLabel + '</span>';
        html += '</div>';
        html += '</div>';

        // Description
        if (e.description) {
            html += '<div class="card-desc">' + (e.description.length > 100 ? e.description.substring(0, 100) + '...' : e.description) + '</div>';
        }

        // Config block
        html += '<div class="config-block">';
        if (isLLM) {
            html += '<div class="lbl">LLM 配置</div>';
            html += '<div class="tag-row">';
            if (e.model_id && e.model_id > 0) {
                html += '<span class="tag llm-tag"><i class="fas fa-microchip"></i> 指定模型 #' + e.model_id + '</span>';
            } else {
                html += '<span class="tag llm-tag"><i class="fas fa-microchip"></i> 系统默认模型</span>';
            }
            if (e.prompt) {
                var promptPreview = e.prompt.length > 60 ? e.prompt.substring(0, 60) + '...' : e.prompt;
                html += '<span class="tag llm-tag"><i class="fas fa-comment-dots"></i> Prompt: ' + promptPreview + '</span>';
            }
            if (e.enable_crawl4ai === 1) {
                html += '<span class="tag warn-tag"><i class="fas fa-spider"></i> Crawl4AI 已启用</span>';
            }
            try {
                var skill = JSON.parse(e.skill_config || '{}');
                var skillKeys = Object.keys(skill);
                if (skillKeys.length > 0) {
                    html += '<span class="tag llm-tag"><i class="fas fa-tools"></i> Skills: ' + skillKeys.join(', ') + '</span>';
                }
            } catch(ex) {}
            html += '</div>';
        } else {
            html += '<div class="lbl">API 配置</div>';
            html += '<div class="tag-row">';
            html += '<span class="tag api-tag"><i class="fas fa-link"></i> ' + (e.api_method || 'GET') + '</span>';
            html += '<span class="tag api-tag"><i class="fas fa-globe"></i> ' + (e.api_url ? e.api_url.substring(0, 50) + (e.api_url.length > 50 ? '...' : '') : '未配置') + '</span>';
            html += '<span class="tag api-tag"><i class="fas fa-file-code"></i> ' + (e.response_type || 'json').toUpperCase() + '</span>';
            html += '</div>';
        }
        html += '</div>';

        // Actions
        html += '<div class="card-actions">';
        html += '<button class="card-btn primary" onclick="testEmp(' + e.id + ')"><i class="fas fa-play"></i> 测试</button>';
        html += '<button class="card-btn secondary" onclick="editEmp(' + e.id + ')"><i class="fas fa-edit"></i> 编辑</button>';
        html += '<button class="card-btn secondary" onclick="toggleEmp(' + e.id + ', ' + (enabled ? 0 : 1) + ')"><i class="fas fa-power-off"></i> ' + (enabled ? '禁用' : '启用') + '</button>';
        html += '<button class="card-btn danger" onclick="deleteEmp(' + e.id + ')"><i class="fas fa-trash"></i></button>';
        html += '</div>';

        html += '</div>';
    });
    $('#deGrid').html(html);
}

function renderPagination() {
    if (totalPages <= 1) {
        $('#pagination').hide();
        return;
    }
    var html = '';
    html += '<button ' + (currentPage <= 1 ? 'disabled' : '') + ' onclick="loadEmployees(' + (currentPage - 1) + ')">&lt; 上一页</button>';
    html += '<span class="page-info">第 ' + currentPage + ' 页 / 共 ' + totalPages + ' 页</span>';
    html += '<button ' + (currentPage >= totalPages ? 'disabled' : '') + ' onclick="loadEmployees(' + (currentPage + 1) + ')">下一页 &gt;</button>';
    $('#pagination').html(html).show();
}

$('#searchBtn').click(function() { loadEmployees(1); });
$('#searchInput').on('keydown', function(e) { if (e.key === 'Enter') loadEmployees(1); });

function loadModelOptions() {
    $.get('/admin/api/digital_employees', {action: 'models'}, function(res) {
        if (res.code === 0) {
            var html = '<option value="0">系统默认模型</option>';
            layui.each(res.data, function(i, m) {
                var label = m.name + ' (' + m.model_id + ')' + (m.is_default ? ' ★' : '');
                html += '<option value="' + m.id + '">' + label + '</option>';
            });
            $('#emodelId').html(html);
        }
    });
}

$('#addBtn').click(function() {
    $('#empId').val('');
    $('#modalTitle').html('<i class="fas fa-user-robot"></i> 创建数字员工');
    $('#deForm')[0].reset();
    selectType('llm');
    $('#eicon').val('fas fa-robot');
    $('#esort').val('0');
    $('#eskillConfig').val('{}');
    $('#eapiParams').val('{}');
    $('#eapiHeaders').val('{}');
    $('#eapiBody').val('{}');
    $('#eapiMethod').val('GET');
    $('#eresponseType').val('json');
    $('#ecrawl4ai').val('0');
    $('#testBlock').hide();
    $('#testOutput').hide().html('');
    loadModelOptions();
    $('#deModal').addClass('active');
});

function editEmp(id) {
    var e = allEmployees.find(function(x) { return x.id === id; });
    if (!e) return;
    $('#empId').val(e.id);
    $('#modalTitle').html('<i class="fas fa-pen-to-square"></i> 编辑数字员工');
    $('#ename').val(e.name);
    $('#ecode').val(e.code);
    $('#eicon').val(e.icon || 'fas fa-robot');
    $('#esort').val(e.sort || 0);
    $('#edesc').val(e.description || '');
    $('#eprompt').val(e.prompt || '');
    $('#eskillConfig').val(e.skill_config || '{}');
    $('#eapiUrl').val(e.api_url || '');
    $('#eapiMethod').val(e.api_method || 'GET');
    $('#eapiParams').val(e.api_params || '{}');
    $('#eapiHeaders').val(e.api_headers || '{}');
    $('#eapiBody').val(e.api_body || '{}');
    $('#eresponseType').val(e.response_type || 'json');
    $('#ecrawl4ai').val(e.enable_crawl4ai || 0);

    selectType(e.type || 'llm');
    loadModelOptions();
    setTimeout(function() { $('#emodelId').val(e.model_id || 0); }, 300);

    $('#testBlock').show();
    $('#testOutput').hide().html('');
    $('#testInput').val('');
    $('#deModal').addClass('active');
}

function closeModal() {
    $('#deModal').removeClass('active');
}

function submitForm() {
    var empId = $('#empId').val();
    var action = empId ? 'edit' : 'add';
    var data = {
        action: action,
        id: parseInt(empId) || 0,
        name: $('#ename').val().trim(),
        code: $('#ecode').val().trim(),
        type: currentType,
        icon: $('#eicon').val().trim(),
        sort: parseInt($('#esort').val()) || 0,
        description: $('#edesc').val().trim(),
        status: 1
    };

    if (!data.name || !data.code) {
        layer.msg('名称和编码不能为空', {icon: 2}); return;
    }

    if (currentType === 'llm') {
        data.model_id = parseInt($('#emodelId').val()) || 0;
        data.prompt = $('#eprompt').val().trim();
        data.skill_config = $('#eskillConfig').val().trim();
        data.enable_crawl4ai = parseInt($('#ecrawl4ai').val()) || 0;
    } else {
        data.api_url = $('#eapiUrl').val().trim();
        data.api_method = $('#eapiMethod').val();
        data.api_params = $('#eapiParams').val().trim();
        data.api_headers = $('#eapiHeaders').val().trim();
        data.api_body = $('#eapiBody').val().trim();
        data.response_type = $('#eresponseType').val();
    }

    $.ajax({
        url: '/admin/api/digital_employees', type: 'POST', contentType: 'application/json',
        data: JSON.stringify(data),
        success: function(res) {
            if (res.code === 0) {
                closeModal(); loadEmployees(currentPage); layer.msg('操作成功', {icon: 1});
            } else { layer.msg(res.msg, {icon: 2}); }
        }
    });
}

function deleteEmp(id) {
    layer.confirm('确定要删除该数字员工吗？此操作不可恢复。', {icon: 3, title: '删除确认'}, function(index) {
        layer.close(index);
        $.ajax({
            url: '/admin/api/digital_employees', type: 'POST', contentType: 'application/json',
            data: JSON.stringify({action: 'delete', id: id}),
            success: function(res) {
                if (res.code === 0) { loadEmployees(currentPage); layer.msg('删除成功', {icon: 1}); }
                else { layer.msg(res.msg, {icon: 2}); }
            }
        });
    });
}

function toggleEmp(id, status) {
    $.ajax({
        url: '/admin/api/digital_employees', type: 'POST', contentType: 'application/json',
        data: JSON.stringify({action: 'toggle', id: id, status: status}),
        success: function(res) {
            if (res.code === 0) { loadEmployees(currentPage); layer.msg('状态已更新', {icon: 1}); }
            else { layer.msg(res.msg, {icon: 2}); }
        }
    });
}

function testEmp(id) {
    editEmp(id);
    setTimeout(function() { $('#testInput').focus(); }, 350);
}

function runTest() {
    var empId = $('#empId').val();
    var input = $('#testInput').val().trim();
    var isLLM = currentType === 'llm';

    if (!empId) return;
    if (!input && isLLM) { layer.msg('请输入测试消息'); return; }

    $('#testOutput').show().html('<span style="color:rgba(255,255,255,0.4);">执行中...</span>');
    $('#testBtn').prop('disabled', true);

    var reqData = {
        action: 'test',
        id: parseInt(empId),
        message: input || '测试'
    };

    if (!isLLM) {
        try {
            reqData.params = JSON.parse($('#eapiParams').val() || '{}');
        } catch(e) {
            reqData.params = {};
        }
    }

    $.ajax({
        url: '/admin/api/digital_employees', type: 'POST', contentType: 'application/json',
        data: JSON.stringify(reqData),
        success: function(res) {
            if (res.code === 0 && res.data) {
                var d = res.data;
                if (d.success) {
                    var output = '';
                    if (d.type === 'articles') {
                        // Display articles as a nice list
                        var articles = d.content || [];
                        output = 'Found ' + (d.count || articles.length) + ' articles:\n\n';
                        for (var i = 0; i < articles.length; i++) {
                            var a = articles[i];
                            output += (i+1) + '. ' + (a.title || '?') + '\n';
                            output += '   ' + (a.url || '') + '\n';
                            if (a.summary) {
                                output += '   ' + a.summary + '\n';
                            }
                            output += '\n';
                        }
                    } else if (d.type === 'json') {
                        output = JSON.stringify(d.content, null, 2);
                    } else {
                        output = d.content || '(空响应)';
                    }
                    if (d.status_code) {
                        output = 'HTTP ' + d.status_code + '\n' + output;
                    }
                    $('#testOutput').html('<span style="color:#6ee7b7;">✓ 测试成功</span>\n\n' + escapeHtml(output));
                } else {
                    $('#testOutput').html('<span style="color:#fca5a5;">✗ 测试失败</span>\n\n' + escapeHtml(d.error || '未知错误'));
                }
            } else {
                $('#testOutput').html('<span style="color:#fca5a5;">✗ ' + escapeHtml(res.msg || '请求失败') + '</span>');
            }
            $('#testBtn').prop('disabled', false);
        },
        error: function() {
            $('#testOutput').html('<span style="color:#fca5a5;">✗ 网络请求失败</span>');
            $('#testBtn').prop('disabled', false);
        }
    });
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

$(document).on('click', '.modal-overlay', function(e) {
    if (e.target === this) closeModal();
});
$(document).on('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});

layui.use(['element', 'layer'], function() {
    var layer = layui.layer;
    window.layer = layer;
    loadEmployees(1);
});
</script>
{% end %}
