<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" type="text/css" href="{{ static_url('dist/bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ static_url('dist/layui/css/layui.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1530 0%, #2d1b4e 40%, #3b2660 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            top: -200px;
            right: -150px;
            border-radius: 50%;
        }
        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.1) 0%, transparent 70%);
            bottom: -200px;
            left: -100px;
            border-radius: 50%;
        }
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }
        .login-panel {
            background: rgba(255,255,255,0.97);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            min-height: 480px;
        }
        .panel-left {
            width: 44%;
            background: linear-gradient(160deg, #6D28D9 0%, #7C3AED 30%, #4C1D95 100%);
            padding: 50px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .panel-left::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
            bottom: -80px;
            right: -80px;
        }
        .brand-icon {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.15);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            font-size: 22px;
            color: #fff;
        }
        .brand-name {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .brand-desc {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 36px;
        }
        .feature-list {
            list-style: none;
        }
        .feature-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            color: rgba(255,255,255,0.9);
            font-size: 14px;
        }
        .feature-list li i {
            font-size: 14px;
            width: 20px;
            text-align: center;
            color: rgba(255,255,255,0.7);
        }
        .panel-right {
            width: 56%;
            padding: 50px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-header {
            margin-bottom: 32px;
        }
        .login-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: #1a1530;
            margin-bottom: 6px;
        }
        .login-header p {
            font-size: 13px;
            color: #888;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 15px;
        }
        .form-input {
            width: 100%;
            height: 44px;
            padding: 0 40px 0 38px;
            border: 1.5px solid #e8e6ef;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.25s;
            background: #faf9fc;
        }
        .form-input:focus {
            border-color: #7C3AED;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.08);
            background: #fff;
        }
        .input-eye {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
        }
        .input-eye:hover { color: #7C3AED; }
        .form-extra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #888;
            cursor: pointer;
        }
        .remember-me input { accent-color: #7C3AED; }
        .forgot-link {
            font-size: 13px;
            color: #7C3AED;
            text-decoration: none;
        }
        .forgot-link:hover { text-decoration: underline; }
        .btn-login {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.5px;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #6D28D9 0%, #5B21B6 100%);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.35);
            transform: translateY(-1px);
        }
        .footer-text {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: #bbb;
        }
        .error-msg {
            background: #FEF2F2;
            color: #DC2626;
            border: 1px solid #FECACA;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 13px;
        }
        @media (max-width: 768px) {
            .login-panel { flex-direction: column; }
            .panel-left { width: 100%; padding: 30px 25px; }
            .panel-right { width: 100%; padding: 35px 25px; }
            .brand-desc { margin-bottom: 20px; }
            .feature-list { display: none; }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-panel">
            <div class="panel-left">
                <div class="brand-icon"><i class="fas fa-binoculars"></i></div>
                <div class="brand-name">智能瞭望与问数系统</div>
                <div class="brand-desc">企业级智能数据洞察平台</div>
                <ul class="feature-list">
                    <li><i class="fas fa-check-circle"></i>多源异构数据智能采集</li>
                    <li><i class="fas fa-check-circle"></i>自然语言交互式数据查询</li>
                    <li><i class="fas fa-check-circle"></i>AI 驱动深度数据分析</li>
                    <li><i class="fas fa-check-circle"></i>实时可视化报表呈现</li>
                </ul>
            </div>
            <div class="panel-right">
                <div class="login-header">
                    <h2>后台管理登录</h2>
                    <p>请输入管理员账号登录系统</p>
                </div>
                {% if error %}
                <div class="error-msg"><i class="fas fa-exclamation-circle mr-1"></i>{{ error }}</div>
                {% end %}
                <form method="post" action="?">
                    {% module xsrf_form_html() %}
                    <div class="form-group">
                        <label class="form-label">管理员账号</label>
                        <div class="input-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" name="username" placeholder="请输入管理员账号" class="form-input" required autocomplete="off">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">登录密码</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" name="password" placeholder="请输入登录密码" class="form-input" required id="pwd">
                            <i class="fas fa-eye-slash input-eye" id="togglePwd"></i>
                        </div>
                    </div>
                    <div class="form-extra">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            <span>记住登录状态</span>
                        </label>
                        <a href="javascript:void(0);" class="forgot-link">忘记密码？</a>
                    </div>
                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt mr-2"></i>登 录 后 台
                    </button>
                </form>
                <div class="footer-text">&copy; 2025 智能瞭望与问数系统 版权所有</div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('togglePwd').addEventListener('click', function() {
            var p = document.getElementById('pwd');
            if (p.type === 'password') {
                p.type = 'text';
                this.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                p.type = 'password';
                this.classList.replace('fa-eye', 'fa-eye-slash');
            }
        });
    </script>
</body>
</html>
