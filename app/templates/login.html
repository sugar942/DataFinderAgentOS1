{% extends "base.html" %}
{% block body %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="fas fa-binoculars"></i>
            <h2>智能瞭望与问数系统</h2>
            <p>用户登录</p>
        </div>
        {% if error %}
        <div class="auth-error">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% end %}
        <form method="post" action="?">
            {% module xsrf_form_html() %}
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-user me-1"></i> 用户名</label>
                <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-lock me-1"></i> 密码</label>
                <input type="password" name="password" class="form-control" placeholder="请输入密码" required autocomplete="current-password">
            </div>
            <button type="submit" class="auth-btn">登 录</button>
        </form>
        <div class="auth-link">
            还没有账号？<a href="/register">立即注册</a>
        </div>
    </div>
</div>
{% end %}
